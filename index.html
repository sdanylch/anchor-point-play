<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column of quiet cards; the dance-floor canvas and the competitor bib are the two bold moments */
:root{
  --bg:#e9ebf2; --surface:#ffffff; --surface-2:#f3f4f9; --ink:#191c35; --muted:#5b6082; --line:#d5d8e6;
  --accent:#d4366a; --accent-soft:#f9dfe8; --on-accent:#ffffff; --accent-ink:#ad1f50; --info:#245fc0; --info-soft:#e2ecfb; --prank:#6b3fc0; --prank-soft:#ece5fa; --duck:#f2b632; --duck-soft:#fbf0d4; --duck-ink:#7a5408;
  --good:#11806e; --good-soft:#d8f1ec; --bad:#c23f3a; --bad-soft:#f8e0de; --warn:#9a6a10;
  --floor:#231f3d; --floor-line:#3f3968; --floor-text:#cfc9f0; --partner:#f2efe6;
  --paper:#fbfaf5; --paper-ink:#1b1b22;
  --gold:#b98a1f; --silver:#7d869a; --bronze:#a2622f;
  --c-time:#d4366a; --c-tech:#2f6fd6; --c-conn:#11806e; --c-mus:#b98a1f; --c-comp:#7a4fc9;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111327; --surface:#1b1e38; --surface-2:#22264a; --ink:#e7e8f6; --muted:#9ca1c6; --line:#2e3259;
  --accent:#ff5c8d; --accent-soft:#3a1d33; --on-accent:#1a0b12; --accent-ink:#ff7aa3; --info:#8ab8ff; --info-soft:#1c2a4a; --prank:#c4a3ff; --prank-soft:#2b2148; --duck:#f2b632; --duck-soft:#3a2f12; --duck-ink:#f5cd6b;
  --good:#3cc4a9; --good-soft:#15352f; --bad:#ff7b72; --bad-soft:#3b1d20; --warn:#e6b04d;
  --floor:#0b0a19; --floor-line:#2e2a52; --floor-text:#b3acd9; --partner:#e9e6dc;
  --gold:#e0b44a; --silver:#a9b1c4; --bronze:#d08a52; color-scheme:dark;
  --c-time:#ff5c8d; --c-tech:#6ea8ff; --c-conn:#3cc4a9; --c-mus:#e0b44a; --c-comp:#b48cff;
}}
:root[data-theme="dark"]{
  --bg:#111327; --surface:#1b1e38; --surface-2:#22264a; --ink:#e7e8f6; --muted:#9ca1c6; --line:#2e3259;
  --accent:#ff5c8d; --accent-soft:#3a1d33; --on-accent:#1a0b12; --accent-ink:#ff7aa3; --info:#8ab8ff; --info-soft:#1c2a4a; --prank:#c4a3ff; --prank-soft:#2b2148; --duck:#f2b632; --duck-soft:#3a2f12; --duck-ink:#f5cd6b;
  --good:#3cc4a9; --good-soft:#15352f; --bad:#ff7b72; --bad-soft:#3b1d20; --warn:#e6b04d;
  --floor:#0b0a19; --floor-line:#2e2a52; --floor-text:#b3acd9; --partner:#e9e6dc;
  --gold:#e0b44a; --silver:#a9b1c4; --bronze:#d08a52; color-scheme:dark;
  --c-time:#ff5c8d; --c-tech:#6ea8ff; --c-conn:#3cc4a9; --c-mus:#e0b44a; --c-comp:#b48cff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:0;align-self:flex-start}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.02em}
.meters{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .lbl{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.pay{font-size:.7rem;color:var(--muted);font-weight:500}
.money{font-family:var(--mono);font-weight:700;font-size:1.25rem}
.track{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--ink);transition:width .6s ease}
.fill.energy{background:var(--good)}
.fill.energy.low{background:var(--bad)}
.fill.points{background:var(--accent)}
.meter.mood{grid-column:2/-1}
button.meter{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.fill.mood{background:var(--gold)}
.fill.mood.low{background:var(--bad)}
.fill.mood.smug{background:var(--muted)}
.lbl .smug{color:var(--accent)}

/* dancer card with bib */
.dancer{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.bib{background:var(--paper);color:var(--paper-ink);border-radius:6px;width:96px;padding:8px 6px 6px;text-align:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.4);transform:rotate(-2deg)}
.bib::before,.bib::after{content:"";position:absolute;top:5px;width:6px;height:6px;border-radius:50%;background:#9aa0b3;box-shadow:0 0 0 1.5px #d9dbe3}
.bib::before{left:6px}.bib::after{right:6px}
.bib .ev{font-size:.55rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.bib .n{font-family:var(--mono);font-weight:700;font-size:1.9rem;line-height:1.1}
.bib .div{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid #1b1b2233;padding-top:3px;margin-top:2px}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .name{font-weight:700;font-size:1.1rem}
.stat{display:grid;grid-template-columns:92px 1fr minmax(30px,auto);gap:8px;align-items:center}
.stat .sl{font-size:.82rem;font-weight:500}
.stat .sv{font-family:var(--mono);font-weight:700;text-align:right;font-size:.85rem}
.stat .rd{grid-column:2/-1;font-size:.72rem;color:var(--muted);margin-top:-5px}
.stat .feel{font-family:inherit;font-size:1rem;color:var(--good)}
.stat .feel.flat{color:var(--muted)}
.read{font-size:.86rem;font-weight:600;margin-top:4px}
.stat .fill{background:var(--ink)}
.track.split{display:flex}
.stat .fill.item{background:var(--gold);border-radius:0 99px 99px 0}
.swatch{display:inline-block;width:10px;height:8px;border-radius:2px;background:var(--gold);margin-right:4px;vertical-align:middle}
.sv .plus{color:var(--gold);font-size:.72rem}
.cash{font-family:var(--mono);color:var(--accent-ink)}
.rtag{font-size:.62rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 5px;margin-left:4px;vertical-align:middle}
.rtag.friendly{color:var(--good);border-color:var(--good)}
.rtag.nem{color:var(--bad);border-color:var(--bad)}
.rivalin{width:100%;margin:6px 0 10px}
table.sheet td,table.sheet th{padding:5px 5px;font-size:.78rem}
td.mk-yes{color:var(--good);font-weight:700}
td.mk-alt{color:var(--warn)}
tr.cutline td{border-top:2px solid var(--accent)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▸";color:var(--muted);font-weight:700;margin-left:auto}
details.fold[open]>summary::after{content:"▾"}
.people{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.people li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.88rem;align-items:baseline}
.howto ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.cash.ok{color:var(--good)}
.cash.short{color:var(--bad)}
.delta{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--good);margin-left:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wk{height:30px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.wk.past{background:var(--line)}
.wk.now{border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:0 0 0 1px var(--accent)}
.wk.ev{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.wk.ev.past{background:var(--line);color:var(--muted)}
.wk.ev.off{background:var(--surface-2);color:var(--muted);border-style:dashed;font-weight:500}
.calrows li.off b{color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}

/* action cards */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.act:hover:not([disabled]){border-color:var(--accent)}
.act .t{font-weight:700;font-size:.98rem}
.act .d{font-size:.8rem;color:var(--muted);flex:1}
.act .c{font-family:var(--mono);font-size:.74rem;font-weight:700}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act .why{font-size:.74rem;color:var(--bad);font-weight:700}

/* pick lists */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .t{font-weight:700}
.opt .lv{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.opt .d{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.opt .c{font-family:var(--mono);font-size:.78rem;font-weight:700;align-self:start}

.diary ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.diary li{font-size:.86rem;color:var(--muted);display:grid;grid-template-columns:44px 1fr;gap:6px}
.diary li b{font-family:var(--mono);color:var(--ink);font-size:.74rem}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.76rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--info-soft);color:var(--info);border-color:transparent} /* info (v56): blue, so it never reads as red */
.warn{font-size:.85rem;color:var(--warn);font-weight:700}

/* start */
.logo{font-size:clamp(2.6rem,13vw,3.8rem);line-height:.95;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.start{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.lede{font-size:1.02rem;max-width:44ch}
form{display:flex;flex-direction:column;gap:10px}
label.f{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:center;font-weight:700;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.9rem}

/* draw cards */
.draws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flip{perspective:800px}
.flip .inner{position:relative;transform-style:preserve-3d;animation:flipin .7s ease both}
.flip:nth-child(2) .inner{animation-delay:.45s}
@keyframes flipin{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.drawcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;backface-visibility:hidden;min-height:170px}
.drawcard .big{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.2}
.wbar{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:.72rem;color:var(--muted)}
.wbar .track{height:6px}
.wbar .fill{background:var(--accent)}

/* dance */
.floorwrap{background:var(--floor);border-radius:var(--r);overflow:hidden;position:relative}
canvas#floor{display:block;width:100%;height:230px}
.count{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-weight:700;color:var(--floor-text);font-size:1.1rem}
.songline{position:absolute;left:12px;top:10px;font-size:.74rem;color:var(--floor-text);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.feed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem;animation:pop .35s ease both}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--mono)}
.mk.good{background:var(--good-soft);color:var(--good)}
.mk.bad{background:var(--bad-soft);color:var(--bad)}
.feed .tag{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
/* songs revealed one at a time, each with its own moments */
.feed li.grp{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;animation:none}
.songcard{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:2px;animation:pop .35s ease both}
.songcard p{margin:0}
.songcard .sh{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fit{font-weight:700}
.fit.good{color:var(--good)}
.fit.bad{color:var(--bad)}
.setlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.setlist p{margin:0}
.vs{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.8rem}
.vs .bar{position:relative;height:8px;background:var(--surface-2);border-radius:99px}
.vs .bar::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.vs .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.vs .bar i.up{left:50%;background:var(--good)}
.vs .bar i.down{right:50%;background:var(--bad)}
.vs .num{text-align:right;font-weight:700}
.vs .num.good{color:var(--good)}
.vs .num.bad{color:var(--bad)}
.mystery{display:flex;gap:8px;align-items:center;font-size:.86rem}
.mystery .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--mono);font-size:.74rem;font-weight:700}

/* season recap */
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .evl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--mono)}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.84rem;margin-top:10px}
.legend .sw{width:14px;height:4px;border-radius:2px}
.legend .num{text-align:right}

/* results */
.placing{display:flex;gap:14px;align-items:center}
.place{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--accent)}
.place.p1{color:var(--gold)}.place.p2{color:var(--silver)}.place.p3{color:var(--bronze)}
/* Awards countdown (v57): placings read out from last to first */
.awl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.awl li{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:.88rem;opacity:0;transform:translateY(6px);animation:awIn .45s ease forwards;animation-delay:var(--d,0s)}
.awl li .pl{font-family:var(--display);font-weight:800;font-size:1.05rem}
.awl li.me{border-width:2px;font-weight:700}
.awl li.me.p1{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.awl li.me.p2{border-color:var(--silver);background:color-mix(in srgb,var(--silver) 16%,var(--surface))}
.awl li.me.p3{border-color:var(--bronze);background:color-mix(in srgb,var(--bronze) 16%,var(--surface))}
.rtag.you{color:var(--ink);border-color:var(--ink)}
.awl li.p1 .pl{color:var(--gold)}.awl li.p2 .pl{color:var(--silver)}.awl li.p3 .pl{color:var(--bronze)}
.aw-after{opacity:0;animation:awIn .45s ease forwards;animation-delay:var(--d,0s)}
@keyframes awIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.awl li,.aw-after{animation:none;opacity:1;transform:none}}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
td.cp,th.cp{text-align:left;white-space:normal;min-width:110px}
td.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.r.cnt{font-weight:700}
tr.me td{background:var(--accent-soft)}
tr.pr td{background:var(--good-soft)}
tr.pr td.cp{color:var(--good);font-weight:700}
td.pl{font-family:var(--mono);font-weight:700}
.jf{font-size:.6rem;letter-spacing:0;text-transform:none;font-weight:500}
td.r.dim{color:var(--muted)}
td.maj{font-family:var(--mono);font-size:.76rem;white-space:nowrap}
.why{font-size:.86rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.timeline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-family:var(--mono);font-size:.74rem;font-weight:700;color:var(--muted);padding-top:2px}
.timeline .wb{display:flex;flex-direction:column;gap:6px;min-width:0}
.timeline li.round .when{color:var(--accent)}
.timeline li.now .when{color:var(--ink)}
.timeline li.now{background:linear-gradient(90deg,var(--accent-soft),transparent 60%);margin-inline:-14px;padding-inline:14px}
.timeline li.next{opacity:.8}
.chip.warn-chip{background:var(--surface-2);color:var(--warn);border-color:var(--warn)}
.banner.evt{border-color:var(--warn)}
.shop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}

<div id="app"></div>

<script id="engine">
const Engine = (() => {
  const R = { rng: Math.random };
  const rnd = () => R.rng();
  const rand = (a, b) => a + rnd() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const sigmoid = x => 1 / (1 + Math.exp(-x));

  const STATS = ['time', 'tech', 'conn', 'mus', 'comp'];
  const LABEL = { time: 'Timing', tech: 'Technique', conn: 'Connection', mus: 'Musicality', comp: 'Composure' };
  const SHORT = { time: 'Timing', tech: 'Tech', conn: 'Conn', mus: 'Music', comp: 'Comp' };
  const WEEKS = 18, PROMO = 16, INCOME = 85, RECOVER = 30;
  // A career is up to CAREER seasons. WSDC doors per division (points per role): `allow` lets you move up,
  // `must` makes you. Moving up is permanent here. Advanced isn't built yet, so 45 Intermediate points ends the career.
  const CAREER = 8;
  const DIVS = { Novice: { allow: 16, must: 30, next: 'Intermediate' }, Intermediate: { allow: 30, must: 45, next: 'Advanced' } };
  // Stats have no 99 cap: higher divisions need more. (The display will move to bands in a later phase.)
  const STAT_MAX = 250;
  // The circuit: the same events every season, at the same time of year. You choose which to go to.
  // size: competitors per role in each division (the WSDC tier follows from it). Every event draws from the same
  // division population (see POP), so bigger events are harder only because more people chase the same 8 spots.
  // travel: 'home' (your own bed), 'drive', 'carpool' (a long drive), 'fly' (flights can be delayed).
  // cost = pass + trip + hotel. prize: 1st/2nd/3rd in cash, or 'pass' = a free pass to a future event.
  // rare: the visiting pro runs a high-level workshop every time (most events don't).
  const EVENTS = {
    lakeside: { name: 'Lakeside Swing Jam', week: 5, travel: 'home', pass: 70, trip: 15, hotel: 0,
      size: { Novice: 10, Intermediate: 8 }, prize: ['pass', 30, 15] },
    harbour: { name: 'Harbour Lights Swing', week: 9, travel: 'drive', pass: 90, trip: 30, hotel: 30,
      size: { Novice: 16, Intermediate: 14 }, prize: [80, 40, 20] },
    sunset: { name: 'Sunset Coast Classic', week: 6, travel: 'fly', pass: 130, trip: 190, hotel: 100,
      size: { Novice: 50, Intermediate: 44 }, prize: [300, 150, 75], rare: true },
    rainforest: { name: 'Rainforest Swing Fest', week: 12, travel: 'carpool', pass: 110, trip: 50, hotel: 140,
      size: { Novice: 30, Intermediate: 26 }, prize: [150, 75, 40] },
    pacific: { name: 'Pacific Crown Open', week: 18, travel: 'fly', pass: 140, trip: 200, hotel: 110,
      size: { Novice: 50, Intermediate: 44 }, prize: [250, 125, 60] },
    // Parked (Steve, v39): these used to join the calendar in week 8. Kept so older saves that have one still work.
    alpine: { name: 'Alpine Swing Escape', week: 10, travel: 'carpool', pass: 100, trip: 45, hotel: 150, late: true,
      size: { Novice: 24, Intermediate: 20 }, prize: [120, 60, 30] },
    riverside: { name: 'Riverside Swing Weekend', week: 14, travel: 'drive', pass: 80, trip: 25, hotel: 70, late: true,
      size: { Novice: 14, Intermediate: 12 }, prize: ['pass', 40, 20] },
  };

  const SUGGESTED = ['harbour', 'rainforest', 'pacific']; // season 1's pre-picked calendar (the classic three)
  const LATE_WEEK = 8;
  const tierOf = field => field <= 10 ? 1 : field < 20 ? 2 : field < 40 ? 3 : 4;
  // A season's calendar: every circuit event, with whether you're going. Plain data for the save.
  const makeCalendar = picks => Object.entries(EVENTS).filter(([, e]) => !e.late).map(([id, e]) => ({ id, week: e.week, going: picks.includes(id) }));
  // An event as you'd enter it: your division's field, strength, tier and total cost.
  function entry(s, c) {
    const e = EVENTS[c.id], div = s.div || 'Novice', field = e.size[div];
    return { ...e, id: c.id, week: c.week, div, field, tier: tierOf(field), cost: e.pass + e.trip + e.hotel };
  }
  const eventAt = (s, week) => { const c = (s.cal || []).find(x => x.week === week && x.going); return c ? entry(s, c) : null; };
  const calendarOf = s => (s.cal || []).slice().sort((a, b) => a.week - b.week).map(c => ({ ...entry(s, c), going: c.going, locked: !!c.locked, booked: !!(c.booked || c.legacy), paid: c.paid || 0, doorPass: !!c.doorPass, missed: !!c.missed, doorOk: doorOk(s, c), doorPrice: doorPrice(entry(s, c)) }));
  // Booking (Steve, v39). "Going" is a booking you can change until the deadline: the end of the week 2 weeks before
  // a local or drive event, 4 weeks before a fly-in. At the deadline you pay the pass (and the flight for a fly-in)
  // and the booking locks: no refunds. The rest (hotel, gas) is due at the event, and once you've booked, the game
  // keeps that money back: nothing you choose can spend it (`spare`). Bad luck (a car repair) can still leave you
  // short, and then you miss the event and what you paid is gone.
  const LEAD = { fly: 4, drive: 2, carpool: 2, home: 2 };
  const bookBy = c => c.week - LEAD[EVENTS[c.id].travel];
  const upfrontOf = (e, free) => (free ? 0 : e.pass) + (e.travel === 'fly' ? e.trip : 0);
  const doorOf = e => e.hotel + (e.travel === 'fly' ? 0 : e.trip);
  const canChange = (s, c) => !c.locked && c.week > s.week;
  // Door passes (Steve, v56): missed the booking? Real events sell passes at the door, for more. After the deadline
  // you can still go: everything is paid at the event, the pass costs $25 more, and a fly-in needs a last-minute
  // flight ($60 more). Free passes from prizes don't apply. Nothing is paid until the event, so you can change your mind.
  const DOOR = { extra: 25, flight: 60 };
  const doorPrice = e => e.cost + DOOR.extra + (e.travel === 'fly' ? DOOR.flight : 0);
  const doorOk = (s, c) => c.locked && !c.booked && !c.legacy && !c.done && c.week >= s.week;
  function doorPass(s, id, on) {
    const c = (s.cal || []).find(x => x.id === id); if (!c || !doorOk(s, c)) return false;
    c.doorPass = c.going = !!on; return true;
  }
  function setGoing(s, id, going) {
    const c = (s.cal || []).find(x => x.id === id);
    if (!c || !canChange(s, c)) return false;
    c.going = !!going; return true;
  }
  // At the end of each week: bookings whose deadline it is lock in, and you pay the up-front part.
  function processBookings(s) {
    const out = [];
    for (const c of s.cal || []) {
      if (c.locked || bookBy(c) > s.week) continue;
      c.locked = true; if (!c.going) continue;
      const e = entry(s, c), free = (s.passes || 0) > 0, up = upfrontOf(e, free);
      if (s.money < up) { c.going = false; c.missed = true; out.push({ bad: true, text: `You couldn\u2019t afford to book ${e.name} ($${up} due). It\u2019s off your calendar, but you can still go with a door pass ($${doorPrice(e)}, all at the event).` }); s.log.unshift({ season: s.season, week: s.week, text: `Couldn\u2019t afford to book ${e.name}` }); continue; }
      s.money -= up; c.paid = up; c.booked = true; if (free) { s.passes--; c.freePass = true; }
      out.push({ text: `Booked ${e.name}: −$${up} (${[free ? 'free pass' : 'pass', e.travel === 'fly' ? 'flight' : ''].filter(Boolean).join(' and ')}). $${doorOf(e)} more at the event.` });
      s.log.unshift({ season: s.season, week: s.week, text: `Booked ${e.name} (−$${up})` });
    }
    if (out.length) s.bookNews = { season: s.season || 1, week: s.week + 1, items: out };
  }
  // What's still to pay for an event: at the door if you've booked, everything if you haven't yet.
  function priceOf(s, ev) {
    const c = (s.cal || []).find(x => x.id === ev.id && x.week === ev.week);
    if (c && c.booked) return doorOf(ev);
    if (c && c.doorPass) return doorPrice(ev);
    if (c && c.legacy) return ev.cost - ((s.passes || 0) > 0 ? ev.pass : 0); // booked before v39: pay it all at the door
    return upfrontOf(ev, (s.passes || 0) > 0) + doorOf(ev);
  }
  // The most you can spend right now and still pay every booked event at the door, counting the pay you'll get first.
  function spare(s) {
    let need = 0, most = s.money;
    for (const c of (s.cal || []).filter(c => (c.booked || c.legacy) && c.going && !c.done && c.week >= s.week).sort((a, b) => a.week - b.week)) {
      need += priceOf(s, entry(s, c)); most = Math.min(most, s.money + INCOME * (c.week - s.week) - need);
    }
    return Math.max(0, most);
  }
  // Every payment still to come for the events you're going to, in date order: the up-front part at the booking
  // deadline (end of that week, before the next payday), the rest at the event.
  function dues(s) {
    const out = []; let passes = s.passes || 0;
    for (const c of (s.cal || []).filter(c => c.going && !c.done && c.week >= s.week)) {
      const e = entry(s, c);
      if (c.booked || c.legacy || c.doorPass) out.push({ week: c.week, amount: priceOf(s, e), ev: e, kind: c.doorPass ? 'doorPass' : 'door' });
      else { const free = passes-- > 0; out.push({ week: Math.max(s.week, bookBy(c)), amount: upfrontOf(e, free), ev: e, kind: 'book' }, { week: c.week, amount: doorOf(e), ev: e, kind: 'door' }); }
    }
    return out.sort((a, b) => a.week - b.week);
  }
  // If you spent `cost` now and nothing else, the first payment you couldn't make (counting your pay), or null.
  function shortfall(s, cost) {
    let paid = 0;
    for (const d of dues(s)) { paid += d.amount; const have = s.money - cost + INCOME * (d.week - s.week) - paid; if (have < 0) return { ...d, short: -have, wait: d.week - s.week }; }
    return null;
  }
  // The most you could spend every week, this one included, and still make every payment (v56, Steve: "how is my
  // money looking?"). The tightest payment sets it; null when nothing is due.

    return d >= 9 ? { arrow: '\u2191\u2191', word: 'big strides' } : d >= 4 ? { arrow: '\u2191', word: 'feels better' } : d >= 1.5 ? { arrow: '\u2197', word: 'a little better' } : { arrow: '\u2192', word: 'about the same' };
  }
  const teachFrac = (s, src, stats) => stats.reduce((a, k) => a + teach(s.stats[k], levelOf(s, src, k)), 0) / stats.length;

  // The one rule for stat gains. `src` is a training source in LV (its level decides how much it still teaches you),
  // or true for things that always land in full (video reviews, small one-offs). The coach's focus stat gets +50%
  // while it lasts. Fractions round fairly (0.3 lands as +1 three times in ten), so a source that has little left
  // to teach you really does give little. Adds what was actually gained to `into` (if given) and returns it.
  // Motivation (Steve, v51): your mind over the season, beside energy (this week's body). Doing the same week again
  // wears it down; socials, new people, near misses, wins and room pranks lift it. It scales training gains by up to
  // ±15% (`effect`), and when it's low you sometimes skip class. Shown as a word and a bar, never a number.
  // Every week it drifts `pull` of the way back to `rest` (highs and lows fade), so a week of socials alone settles
  // around Keen. Gains are ×1 at `mid` (a sensible, varied player's usual level), up to +15% at max, −15% at min.
  const MOOD = { start: 70, min: 40, max: 100, mid: 76, rest: 68, pull: .2, effect: .15, same: 5, rut: 10, rutAt: 3, money: 3, social: 2, mock: 1,
    leah: 2, restLow: 2, newPal: 4, skipBelow: 50, skipChance: .2, firedUp: 85, season: 75,
    smug: .15, smugWeeks: 2, near: 1, win: 8, asHoped: 3, nearMiss: 6, flop: 10, h2hWin: 2, h2hLoss: 2, evSocial: 1, prank: 5, pranked: 3, prankChance: .25, paybackChance: .6 };
  const MOOD_WORDS = [[85, 'Fired up'], [70, 'Keen'], [55, 'Going through the motions'], [0, 'Burnt out']];
  const moodOf = s => s.mood === undefined ? MOOD.start : s.mood;
  // Complacency (v53, Steve): two wins in a row and training lands 15% less for 2 weeks, until anything but a win.
  const isSmug = s => !!(s.complacent && absWeek(s) <= s.complacent.until);
  const moodWord = s => MOOD_WORDS.find(([at]) => moodOf(s) >= at)[1];
  const moodMult = s => { const m = moodOf(s); return 1 + MOOD.effect * (m - MOOD.mid) / (m >= MOOD.mid ? MOOD.max - MOOD.mid : MOOD.mid - MOOD.min); };
  function moodShift(s, n, why, log) {
    const before = moodOf(s); s.mood = clamp(before + n, MOOD.min, MOOD.max);
    const got = s.mood - before; if (got && log) log.push({ n: got, why }); return got;
  }
  // What counts as "the same week": class, practice (any partner counts as partner practice), a private (any topic)
  // and the social.
  const planKey = p => [!!p.cls, ['rest', 'solo'].includes(p.prac) ? p.prac : 'partner', !!p.priv, !!p.social].join('|');
  // How different two weeks are (v53): each part that changed counts 1, a different practice partner counts ½.
  function planDiff(a, b) {
    const ka = planKey(a).split('|'), kb = planKey(b).split('|');
    return ka.reduce((n, x, i) => n + (x !== kb[i] ? 1 : 0), 0) + (ka[1] === 'partner' && kb[1] === 'partner' && a.prac !== b.prac ? .5 : 0);
  }
  function gain(s, st, base, src, into) {
    const f = src === true ? 1 : teach(s.stats[st], levelOf(s, src, st));
    const fm = s.focus && s.focus.stat === st && s.week <= s.focus.until ? 1.5 : 1;
    const mm = src === true ? 1 : moodMult(s) * (isSmug(s) ? 1 - MOOD.smug : 1); // motivation (and complacency) scale training
    const x = base * f * fm * mm, whole = Math.floor(x);
    const before = s.stats[st]; s.stats[st] = Math.min(STAT_MAX, before + whole + (rnd() < x - whole ? 1 : 0));
    const got = s.stats[st] - before;
    if (into && got) into[st] = (into[st] || 0) + got;
    return got;
  }

  /* ---------- weekly planner ---------- */
  const emptyPlan = () => ({ cls: false, prac: 'solo', priv: null, social: false, mock: false });
  // Your community runs a mock J&J night the week before the season's three biggest events (Steve: not before every
  // event). It's practice for the whole scene, so it runs whether or not you're going.
  const MOCK_BEFORE = ['sunset', 'rainforest', 'pacific'];
  const mockFor = s => calendarOf(s).find(e => e.week === s.week + 1 && MOCK_BEFORE.includes(e.id)) || null;
  const mockAvailable = s => !!mockFor(s) && socialAvailable(s);
  const socialAvailable = s => !eventAt(s, s.week);
  const privatePrice = s => (s.packs > 0 ? 0 : PRIVATE_COST - (s.discount ? DISCOUNT : 0)); // a lesson pack is prepaid
  const devMult = s => .6 + s.sc / 100;
  const lenaChance = (s, socialed) => Math.min(.65, .22 + s.sc / 300 + (socialed ? .08 : 0));
  const proChance = s => .1 + s.sc / 400;

  function planCost(s, p) {
    let money = 0, energy = 0;
    if (p.cls) { money += CLASS.cost; energy += CLASS.energy; }
    if (p.prac !== 'none') { money += PRACTICE[p.prac].cost; energy += PRACTICE[p.prac].energy; }
    if (p.priv) { money += privatePrice(s); energy += PRIVATE_ENERGY; }
    if (p.social && socialAvailable(s)) { money += SOCIAL.cost; energy += SOCIAL.energy; }
    if (p.social && socialAvailable(s) && p.mock && mockAvailable(s)) { money += MOCK.cost; energy += MOCK.energy; }
    return { money, energy };
  }
  function scGainOf(s, p) { return (p.cls ? SC.cls : 0) + (p.social && socialAvailable(s) ? SC.social : 0) + (p.social && p.mock && mockAvailable(s) ? SC.mock : 0); }
  function checkPlan(s, p) {
    const cost = planCost(s, p);
    if (p.prac === 'priya' && !knows(s, 'priya')) return { ok: false, why: 'You don\u2019t have a practice partner yet', cost };
    if (p.prac === 'lena' && !s.lenaInTown) return { ok: false, why: named(s, '{lena} didn\u2019t ask this week'), cost };
    if (p.prac === 'dev' && !s.devUnlocked) return { ok: false, why: named(s, '{dev} practices with Intermediates and up'), cost };
    if (p.prac === 'priya' && s.evt && s.evt.id === 'priyaSick') return { ok: false, why: named(s, '{priya} is sick this week'), cost };
    if (cost.money > s.money) return { ok: false, why: 'Not enough money', cost };
    if (cost.money > spare(s)) return { ok: false, why: `${holdWhy(s)}: you can spend $${spare(s)}`, cost };
    if (s.energy - cost.energy < 0) return { ok: false, why: 'Not enough energy', cost };
    return { ok: true, cost };
  }
  function sanitizePlan(s, p) {
    const q = { ...emptyPlan(), ...p };
    if (!PRACTICE[q.prac]) q.prac = 'solo';
    if (q.prac === 'priya' && !knows(s, 'priya')) q.prac = 'solo';
    if (q.prac === 'lena' && !s.lenaInTown) q.prac = 'solo';
    if (q.prac === 'dev' && !s.devUnlocked) q.prac = 'solo';
    if (q.prac === 'priya' && s.evt && s.evt.id === 'priyaSick') q.prac = 'solo';
    if (!socialAvailable(s)) q.social = false;
    if (!mockAvailable(s) || !q.social) q.mock = false;
    return q;
  }

  function applyWeek(s, p) {
    const planned = p, moods = [];
    s.mood = moodOf(s) + (MOOD.rest - moodOf(s)) * MOOD.pull; // highs and lows fade
    // Event weeks (a taper) don't count either way (v53): the routine around them still wears on you.
    const evWeek = !!eventAt(s, s.week), prev = s.routine, diff = prev ? planDiff(prev, p) : 9;
    if (!evWeek) { s.moodRun = diff <= .5 ? (s.moodRun || 1) + 1 : 1; s.routine = { ...p }; } // a new practice partner alone doesn't break the routine
    const skipped = p.cls && moodOf(s) < MOOD.skipBelow && rnd() < MOOD.skipChance; // low motivation: you don't go
    if (skipped) p = { ...p, cls: false };
    const cost = planCost(s, p);
    s.money -= cost.money;
    s.energy = Math.min(100, s.energy - cost.energy);
    const total = {}; const items = [];
    const add = (d, st, base, raw) => { const got = gain(s, st, base, raw, d); total[st] = (total[st] || 0) + got; };
    if (skipped) items.push({ day: 'Tue', title: 'Skipped class', d: {}, note: 'You just weren\u2019t feeling it. You stayed home and scrolled dance videos instead.', tone: 'meh' });
    if (p.cls) {
      const ct = s.clsTopic || rollClass(); const topic = ct.stat; const q = rnd();
      const qual = q < .15 ? 'dud' : q < .8 ? 'solid' : 'great';
      const d = {}; add(d, topic, qual === 'dud' ? 1 : qual === 'solid' ? rand(2.5, 4) : rand(4.5, 6), 'cls');
      if (rnd() < .75) add(d, 'conn', 1, 'cls'); // partners rotate every few minutes; usually something clicks
      items.push({ day: 'Tue', title: 'Group class: ' + ct.name, d, note: qual === 'dud' ? 'Mostly review. You still showed up.' : qual === 'great' ? 'One of those classes that rewires your dancing.' : 'A solid class.', tone: qual === 'dud' ? 'meh' : 'good' });
    }
    if (p.prac === 'rest') items.push({ day: 'Wed', title: 'Rest night', d: {}, note: 'Feet up, finals footage on. +10 energy.', tone: 'meh' });
    if (p.prac !== 'rest') {
      const d = {}; let note;
      if (p.prac === 'solo') { add(d, 'time', rand(1.5, 3) * (s.gear.earbuds ? 1.5 : 1), 'solo'); note = s.gear.earbuds ? 'Triples to the metronome in your earbuds, on the bus and in the kitchen.' : 'Twenty minutes of triples to a metronome in the kitchen.'; }
      else if (p.prac === 'priya') {
        const was = s.chem; s.chem = Math.min(3, s.chem + 1);
        add(d, 'tech', rand(3, 5) + s.chem * .7, 'priya'); add(d, 'conn', rand(3, 5) + s.chem * .7, 'priya'); add(d, 'time', rand(1, 2), 'priya');
        note = named(s, was >= 3 ? PRIYA_LINES[s.week % PRIYA_LINES.length] : s.chem >= 3 ? 'You and {priya} finish each other’s patterns now. Full chemistry.' : 'You and {priya} are starting to click. Chemistry ' + s.chem + '/3.');
      } else if (p.prac === 'lena') {
        // An All-Star teaches far above you, so her gains keep coming long after a class stops teaching you much.
        const m = LENA_MULT; add(d, 'time', rand(2.5, 4) * m, 'lena'); add(d, 'tech', rand(3.5, 5.5) * m, 'lena'); add(d, 'conn', rand(3.5, 5.5) * m, 'lena'); add(d, 'mus', rand(2.5, 4.5) * m, 'lena'); add(d, 'comp', rand(1, 2.5) * m, 'lena');
        note = named(s, 'Dancing with {lena} showed you what the next level feels like.');
      } else {
        const m = devMult(s) * DEV_BASE; add(d, 'mus', rand(4, 6) * m, 'dev'); add(d, 'time', rand(2, 3.5) * m, 'dev'); add(d, 'conn', rand(1, 2) * m, 'dev');
        note = named(s, m >= 1.1 ? '{dev} has you playing with every accent now. {dev:They} is invested.' : '{dev} walks you through the song structure before every run.');
      }
      items.push({ day: 'Wed', title: named(s, PRACTICE[p.prac].long), d, note, tone: 'good' });
    }
    if (p.priv) {
      const d = {}; add(d, p.priv, rand(7, 10), 'private'); add(d, 'comp', 1, 'private');
      const fromPack = s.packs > 0; if (fromPack) s.packs--;
      const used = !fromPack && s.discount; if (used) s.discount = false;
      const first = !s.privSeen; s.privSeen = true; // the coach explanation only on your first private
      items.push({ day: 'Thu', title: 'Private lesson: ' + LABEL[p.priv], d, note: (fromPack ? `From your lesson pack (${s.packs} left). ` : used ? 'Used your $40 discount. ' : '') + (first ? 'Your coach teaches well above your level, so privates keep paying off as you improve.' : 'An hour of focused work with your coach.'), read: readStat(s, p.priv, 'Your coach'), tone: 'good' });
    }
    if (p.social && socialAvailable(s)) {
      const d = {}; add(d, 'conn', rand(1, 2.5), 'social'); add(d, 'mus', rand(1.5, 3), 'social'); add(d, 'time', rand(.5, 1.5), 'social'); add(d, 'comp', rand(.5, 1.5), 'social');

      if (s.evt && s.evt.id === 'blues') { add(d, 'mus', 2, true); note = 'All-blues night. You found every pause in every song.'; }
      if (s.evt && s.evt.id === 'birthday') { add(d, 'comp', 2, true); s.sc = Math.min(100, s.sc + 3); note = 'Birthday jam: a new partner every eight counts while the whole room watched.'; }
      items.push({ day: 'Fri', title: 'Friday social', d, note, tone: 'good' });
      if (p.mock && mockAvailable(s)) {
        const d2 = {}; add(d2, 'comp', rand(3, 4.5), 'mock'); add(d2, 'conn', rand(1, 2), 'mock');
        items.push({ day: 'Fri', title: 'Mock J&J night', d: d2, note: 'Your community ran practice heats with random partners and random songs. Next week will feel familiar.', tone: 'good' });
      }
    }
    const scg = scGainOf(s, p) + (scGainOf(s, p) && moodOf(s) >= MOOD.firedUp ? 2 : 0); // fired up: you light up the room
    s.sc = Math.min(100, s.sc + scg);
    if (!evWeek && diff === 0) moodShift(s, -(MOOD.same + (s.moodRun >= MOOD.rutAt ? MOOD.rut : 0)), s.moodRun >= MOOD.rutAt ? `the same week, ${s.moodRun} in a row` : 'the same week as last week', moods);
    else if (!evWeek && diff <= 1) moodShift(s, -MOOD.near - (diff <= .5 && s.moodRun >= MOOD.rutAt ? MOOD.same : 0), diff <= .5 && s.moodRun >= MOOD.rutAt ? `the same routine, ${s.moodRun} weeks running` : 'nearly the same week again', moods);
    if (p.social && socialAvailable(s)) moodShift(s, MOOD.social + (p.mock && mockAvailable(s) ? MOOD.mock : 0), 'the Friday social', moods);
    if (p.prac === 'lena') moodShift(s, MOOD.leah, named(s, 'practice with {lena}'), moods);
    if (p.prac === 'rest' && moodOf(s) < 60) moodShift(s, MOOD.restLow, 'a night off', moods);
    if (spare(s) < 40) moodShift(s, -MOOD.money, 'money is tight', moods);

    const rm = rivalMoment(s, p); if (rm) items.push(rm);
    if (!items.length) items.push({ day: '', title: 'A quiet week', d: {}, note: 'Nothing booked. Your body thanks you.', tone: 'meh' });
    s.lastPlan = { ...planned };
    const names = items.filter(i => i.tone !== 'news').map(i => i.title.split(':')[0]).join(', ');
    s.log.unshift({ week: s.week, text: names });
    return { items, deltas: total, sc: scg, money: cost.money, energy: cost.energy, moods };
  }

  // Studios post next week's class topic, so you can decide whether it's the class you need.
  function rollClass() { const stat = pick(STATS); return { stat, name: pick(CLASS_TOPICS[stat]) }; }
  function endWeek(s, seasonBreak) {
    // Priya competes at the circuit's events even when you don't go.
    const ce = (s.cal || []).find(c => c.week === s.week && !EVENTS[c.id].late);
    if (ce && !seasonBreak && !(s.wk && s.wk.res.week === s.week && (s.wk.res.season || 1) === (s.season || 1))) { const ev = entry({ div: s.priya.div }, ce); if (POP[ev.div]) { agePop(s); applyPriya(s, priyaRoll(s, ev), ev); } }
    if (s.priya && POP[s.priya.div]) s.priya.skill = r1(s.priya.skill + POP.gain * s.priya.rate * teach(s.priya.skill, POP[s.priya.div].level));
    const log = (s.statLog = s.statLog || []), last = log[log.length - 1];
    if (!last || last.season !== (s.season || 1) || last.week !== s.week) log.push({ season: s.season || 1, week: s.week, stats: { ...s.stats } });
    if (!seasonBreak && s.week >= WEEKS) { endSeason(s); return; } // the last week had no event for you
    const socialed = !!(s.lastPlan && s.lastPlan.social);
    if (!seasonBreak) processBookings(s);
    s.week += 1; s.money += INCOME; s.energy = Math.min(100, s.energy + RECOVER);
    s.sc = Math.max(0, s.sc - SC.decay);
    s.pals = s.pals || {};
    const first = (s.season || 1) === 1;
    if (!s.pals.priya && (!first || s.week >= 2)) s.pals.priya = { at: absWeek(s), social: socialed, cls: !!(s.lastPlan && s.lastPlan.cls) };
    s.lenaInTown = first && s.week < 4 ? false : !s.pals.lena ? true : rnd() < lenaChance(s, socialed); // her first ask is week 4
    if (s.lenaInTown && !s.pals.lena) s.pals.lena = { at: absWeek(s) };
    for (const k of ['priya', 'lena', 'dev']) if (s.pals[k] && !s.pals[k].lift && s.pals[k].at <= absWeek(s)) { s.pals[k].lift = true; moodShift(s, MOOD.newPal); } // a new practice partner
    s.evt = seasonBreak ? null : rollEvent(s); // no offer (or its instant money) across the season break
    s.clsTopic = rollClass();
  }

  // Practice with Priya once your chemistry is full (Steve, v56): no more "chemistry" lines, just the session.
  const PRIYA_LINES = ['You and {priya} drilled the boring stuff. It shows.', 'An hour of anchors with {priya}. Neither of you blinked first.', '{priya} brought the coffee. You brought a pattern you saw on YouTube. It half worked.', 'You and {priya} ran the same whip twenty times until it felt like nothing.', '{priya} filmed your last run-through. Better than last week.'];
  /* ---------- weekly random events ---------- */
  const WEEK_EVENTS = [
    { id: 'overtime', w: 3, text: 'Your manager offers an extra shift Thursday: +$70, but it costs 12 energy.', yes: 'Take the shift', no: 'Pass',
      apply: s => { s.money += 70; s.energy = Math.max(0, s.energy - 12); return 'Extra shift done. +$70.'; } },
    { id: 'shoes', w: 2, once: true, cost: 40, text: 'A friend is selling barely-worn suede dance shoes for $40. Better pivots and cleaner footwork: a little Technique and Timing, for good.', yes: 'Buy them ($40)', no: 'Pass',
      ok: s => s.money >= 40, apply: s => { s.money -= 40; s.stats.tech = Math.min(STAT_MAX, s.stats.tech + 2); s.stats.time = Math.min(STAT_MAX, s.stats.time + 1); return 'New shoes. Technique and Timing up a little.'; } },
    { id: 'popup', w: 2, cost: 50, text: 'A touring pro is running a Sunday intensive in town: three hours, $50, −8 energy.', yes: 'Sign up ($50)', no: 'Pass',
      ok: s => s.money >= 50, init: e => { e.stat = pick(STATS); e.text = `A touring pro is running a Sunday intensive on ${LABEL[e.stat].toLowerCase()}: three hours, $50, −8 energy, a big step up. A touring pro teaches far above your level, so it lands even when classes have stopped teaching you much.`; },
      apply: (s, e) => { s.money -= 50; s.energy = Math.max(0, s.energy - 8); gain(s, e.stat, randi(5, 7), 'popup'); return `Three hours of drilling with a touring pro. ${LABEL[e.stat]} up. ${readStat(s, e.stat, 'The pro')}`; } },
    { id: 'party', w: 2, text: 'Someone from the scene is hosting a house-party social Saturday. Free, −10 energy, community +6.', yes: 'Go', no: 'Stay home',
      apply: s => { s.energy = Math.max(0, s.energy - 10); s.sc = Math.min(100, s.sc + 6); s.stats.conn = Math.min(STAT_MAX, s.stats.conn + 1); return 'Kitchen-floor dancing till midnight. Community +6.'; } },
    { id: 'cold', w: 2, big: '\u221212 energy', text: 'A cold is going around the office, and you caught it.',
      now: s => { s.energy = Math.max(0, s.energy - 12); } },
    { id: 'priyaSick', w: 2, text: '{priya} is sick this week and can\u2019t practice.', cond: s => s.chem >= 1 },
    { id: 'blues', w: 2, text: 'Guest DJ at Friday\u2019s social: all-blues night. Extra musicality if you go.' },
    { id: 'birthday', w: 1, once: true, text: 'Birthday week! If you come Friday, the social will do a birthday jam for you: a little Composure, community +3.' },
    { id: 'refund', w: 1, once: true, big: '+$60', text: 'Your tax refund came in.', now: s => { s.money += 60; } },
    { id: 'repair', w: 1, big: '\u2212$50', text: 'Car repair bill. It had to be done.', now: s => { s.money = Math.max(0, s.money - 50); } },
    { id: 'djset', w: 1, text: 'Your friend is playing their first DJ set at a Saturday house party. Free, −8 energy, a little Musicality and community +3.', yes: 'Go', no: 'Stay home',
      apply: s => { s.energy = Math.max(0, s.energy - 8); gain(s, 'mus', 2, true); s.sc = Math.min(100, s.sc + 3); return 'Three hours of songs you had never heard. Musicality up a little.'; } },
    { id: 'carpool', w: 2, cond: s => { const n = eventAt(s, s.week + 1); return !!n && n.travel !== 'home' && !s.carpool; }, yes: 'Take the seat', no: 'Pass',
      init: (e, s) => { e.text = `Friends are driving to ${eventAt(s, s.week + 1).name} next week and have a spare seat: $40 off your travel, but a long drive (−8 energy when you arrive).`; },
      apply: s => { s.carpool = true; return 'You have a seat in the car. $40 off travel next week.'; } },
    { id: 'lessonpack', w: 2, once: true, cost: 140, text: 'Your studio is running a lesson-pack sale: two privates for $140 (normally $160). Use them on any Thursday.', yes: 'Buy the pack ($140)', no: 'Pass',
      ok: s => s.money >= 140, apply: s => { s.money -= 140; s.packs = (s.packs || 0) + 2; return 'Two privates banked. Your next two Thursdays are prepaid.'; } },
  ];
  function rollEvent(s) {
    if (s.week < 2 || eventAt(s, s.week) || rnd() > .5) return null;
    const pool = WEEK_EVENTS.filter(e => (!e.cond || e.cond(s)) && !(e.once && (s.seenEvents || []).includes(e.id) || (e.id === 'birthday' && s.hadBirthday)));
    let r = rnd() * pool.reduce((a, e) => a + e.w, 0), ev = pool[0];
    for (const e of pool) { r -= e.w; if (r <= 0) { ev = e; break; } }
    const inst = { id: ev.id, cost: ev.cost || 0, big: ev.big || null, text: named(s, ev.text), yes: ev.yes || null, no: ev.no || null, resolved: !ev.yes, result: null };
    if (ev.init) ev.init(inst, s);
    if (ev.once) s.seenEvents = [...(s.seenEvents || []), ev.id]; // shoes, refund and birthday happen once a season
    if (ev.now) ev.now(s);

  }
  function eventOk(s) { const e = s.evt; if (!e || !e.yes) return false; const d = WEEK_EVENTS.find(x => x.id === e.id); return (!d.ok || d.ok(s)) && (e.cost || 0) <= spare(s); }
  function answerEvent(s, yes) {
    const e = s.evt; if (!e || e.resolved) return null;
    e.resolved = true;
    if (yes && eventOk(s)) { const d = WEEK_EVENTS.find(x => x.id === e.id); e.result = d.apply(s, e); e.took = true; }
    else e.result = 'You passed.';
    return e.result;
  }

  return `<p style="font-size:.86rem">Your heat partners, one per song: ${heat.map(x => `${esc(x.name)}${ids.has(x.id) ? ` <b>(${tag})</b>` : ''}`).join(' · ')}</p>
    ${known.length ? `<p class="muted tiny">You'd danced with ${andList(known.map(esc))} before, and your connection showed. The judges noticed, a little.</p>` : ''}`;
}
function ptsTable(tier) { const P = E.POINTS[tier], n = Math.min(5, P.length); return P.slice(0, n).map((p, i) => E.ordinal(i + 1) + ' ' + p).join(' · ') + (P.length > 5 ? ' · 6th–8th ' + P[5] : ` · ${E.ordinal(n + 1)}–8th no points`); }
function reviewBlock() {
  const r = V.ev; const opts = E.reviewOptions(S, r);
  if (!opts.length) return '';
  if (V.review) {
    const rv = V.review;
    return `<section class="block"><p class="eyebrow">Video review</p>
      <h2>${rv.kind === 'coach' ? 'Your coach watched the footage' : 'You watched your own footage'}</h2>
      <div class="chips">${Object.entries(rv.deltas).map(([k, v]) => gainChip(k, v)).join('')}</div>
      ${rv.read ? `<p>${rv.read.map(esc).join('<br>')}</p>${readHint()}` : ''}
      ${rv.note ? `<p>${esc(rv.note)}</p><p class="muted tiny">Focus on ${E.LABEL[rv.leak].toLowerCase()} for the next 2 weeks: gains in it are 50% bigger.</p>` : ''}</section>`;
  }
  const footage = !!(r.semi || r.madeFinal);
  const fails = r.fails.length;
  const opt = (kind, title, desc) => {
    const cost = E.REVIEW[kind]; const ok = S.money >= cost;
    return `<button class="opt" data-review="${kind}" ${ok ? '' : 'disabled'}><span class="t">${title}</span><span class="c">${cost ? '$' + cost : 'Free'}</span><span class="d">${desc}${ok ? shortNote(cost) : ' <b style="color:var(--bad)">Not enough money.</b>'}</span></button>`;
  };
  return `<section class="block"><p class="eyebrow">Optional · doesn't use a week</p><h2>Video review</h2>
    <p class="muted" style="font-size:.86rem">${footage ? `Your ${r.madeFinal ? 'final' : 'semifinal'} was filmed. ${fails ? `${fails} moment${fails === 1 ? '' : 's'} went wrong. The review works on those first.` : 'Nothing went wrong, so the review works on your weakest area.'}` : `Prelims weren't filmed, but a friend caught your heat on their phone.`}</p>
    <div class="stack">
      ${footage ? opt('self', 'Watch it yourself', `${cap(E.gainWord(E.reviewBudget(S, r, 'self')))}, spread across what went wrong.`) + opt('coach', 'Send it to a coach', `${cap(E.gainWord(E.reviewBudget(S, r, 'coach')))}, plus the one thing to fix first (gains in it are 50% bigger for 2 weeks), and where that skill and your best one stand in ${divNow()}.`)
        : opt('self', 'Watch the phone video', `${cap(E.gainWord(E.reviewBudget(S, r, 'self')))} in your weakest area against this field.`)}
    </div></section>`;
}


// Between events the game has four tabs (v56). A dot means something there needs you.
const TABS = [['week', 'Week'], ['season', 'Season'], ['me', 'Me'], ['rivals', 'Rivals']];
const tabDot = {
  season: () => !tabsSeen || E.calendarOf(S).some(e => !e.locked && e.going && E.bookBy(e) === S.week),
  me: () => shopNew().length > 0 || (S.meSeen !== undefined ? S.meSeen !== meKey() : meKey() !== ''),
  rivals: () => !!suggestCard(),
};
// What's new on the Me tab: coaches' reads and people you know.
const readKey = r => `${r.season}.${r.week}.${r.word}`;
const meKey = () => Object.values(S.reads || {}).map(readKey).join(); // new people don't earn a dot (Steve: noise)
function tabbar(cur) {
  const bubble = tabsSeen ? '' : `<div class="tabbubble" role="note">Your events, skills and rivals live down here ↓</div>`;
  return `<div class="tabspace"></div>${bubble}<nav class="tabbar" aria-label="Sections"><div class="in">${TABS.map(([k, t]) => `<button data-tab="${k}"${k === cur ? ' aria-current="page"' : ''}>${t}${k !== cur && tabDot[k] && tabDot[k]() ? '<span class="dot" aria-label="needs you"></span>' : ''}</button>`).join('')}</div></nav>`;
}
// The Week tab's "Coming up" (v56, Steve): your next event with its booking in one line, and Going / Not going right
// there until it books. An event you're skipping shows too while you can still book it, so none sneaks past you.
const upcoming = () => E.calendarOf(S).filter(e => e.week > S.week && !thisSeason().some(h => h.week === e.week));
function comingUp() {
  const evs = upcoming(), nx = evs.find(e => e.going), soon = e => !e.going && (!nx || e.week < nx.week), nb = evs.find(e => soon(e) && e.missed && e.doorOk) || evs.find(e => soon(e) && (!e.locked || e.doorOk)); // a booking that fell through comes first
  if (!nx && !nb) return '';
  const inWk = e => { const w = e.week - S.week; return `in ${w} week${w > 1 ? 's' : ''}`; };
  const toggle = e => `<div class="choices">${`<button class="choice" data-cal="${e.id}" data-on="1" aria-pressed="${e.going}">Going</button><button class="choice" data-cal="${e.id}" data-on="0" aria-pressed="${!e.going}">Not going</button>`}</div>`;
  const row = e => {
    if (!e.going && e.locked) return `<div class="uprow"><p><b>${esc(e.name)}</b> ${inWk(e)} · <span class="muted">${e.missed ? 'the booking fell through' : 'booking closed'}</span> <span class="muted tiny">(a door pass is $${e.doorPrice}, all at the event)</span></p><div class="choices"><button class="choice" data-door="${e.id}" data-on="1">Door pass</button></div></div>`;
    if (!e.going) return `<div class="uprow"><p><b>${esc(e.name)}</b> ${inWk(e)} · <span class="muted">not going</span> <span class="muted tiny">(Tier ${e.tier}, $${E.priceOf(S, e)})</span></p><div class="choices"><button class="choice" data-cal="${e.id}" data-on="1">Add it</button></div></div>`;
    if (e.doorPass) return `<div class="uprow"><p><b>${esc(e.name)}</b> ${inWk(e)} · door pass <span class="muted tiny">($${e.doorPrice}, all at the event)</span></p><div class="choices"><button class="choice" data-door="${e.id}" data-on="1" aria-pressed="true">Going</button><button class="choice" data-door="${e.id}" data-on="0" aria-pressed="false">Not going</button></div></div>`;
    if (e.booked || e.locked) return `<div class="uprow"><p><b>${esc(e.name)}</b> ${inWk(e)} · <span style="color:var(--good);font-weight:700">booked</span> <span class="muted tiny">$${E.priceOf(S, e)} still to pay there</span></p></div>`;
    const now = E.bookBy(e) === S.week, up = E.upfrontOf(e, (S.passes || 0) > 0);
    return `<div class="uprow${now ? ' due' : ''}"><p><b>${esc(e.name)}</b> ${inWk(e)} · ${now ? `<b class="warn">books this Friday: $${up}, no refunds</b>` : `book by week ${E.bookBy(e)} <span class="muted tiny">($${up} then, $${E.doorOf(e)} there)</span>`}</p>${toggle(e)}</div>`;
  };
  return `<section class="block upnext"><div class="sec-head"><p class="eyebrow">Coming up</p><button class="linkbtn" data-tab="season">Season ›</button></div>
    ${[nb, nx].filter(Boolean).sort((a, b) => a.week - b.week).map(row).join('')}${nx && !E.shortfall(S, 0) ? spareLine() : ''}</section>`;
}
function rivalsTab() {
  const all = Object.entries(S.rivalry || {}).map(([id, R]) => ({ id, R, d: rivalOf(id) }));
  const act = all.filter(x => !x.R.former && x.d && x.d.rival), past = all.filter(x => x.R.former), nem = nemesisOf(seasonNo());
  const card = ({ id, R, d }) => { const last = R.meets[R.meets.length - 1];
    return `<section class="block">${R.main ? '<p class="eyebrow">Your main rival</p>' : ''}<h2>${esc(R.name)}${rivalTags(R, id === nem)}</h2>
      ${R.line ? `<p class="muted tiny">${esc(R.line)}</p>` : ''}
      ${V.editLabel === id ? `<div style="margin:6px 0">${labelPicker(R.tone, E.labelOf(R), 'relabel', 'relabelOwn', '')}<div class="choices" style="margin-top:6px"><button class="choice" data-relabelown="${id}">Use my own</button><button class="choice" data-relabelno="1">Done</button></div></div>`
        : `<button class="linkbtn" data-editlabel="${id}">Change the description</button>`}
      <p>${d.div}${d.div !== divNow() ? ' (not your division right now)' : ''} · ${E.gapWord(S, d)}. Head-to-head <b class="num">${R.w}–${R.l}</b>${R.meets.length ? '' : ': you haven’t met at an event yet'}.</p>
      ${last ? `<p class="muted tiny">Last met at ${esc(last.ev)}${seasonNo() > 1 ? ` (season ${last.season})` : ''}: you ${esc(last.me)}, ${esc(R.name)} ${esc(last.them)}.</p>` : ''}
      ${V.confirmStop === id ? `<p class="warn">Stop tracking your main rival? The record stays under Former rivals.</p><div class="choices"><button class="choice" data-stopok="${id}">Yes, stop tracking</button><button class="choice" data-stopno="1">Keep them</button></div>`
        : `<button class="btn ghost wide" data-stop="${id}">Stop tracking</button>`}</section>`; };
  return `<p class="muted" style="font-size:.88rem">Up to ${E.RIVAL_MAX} at a time. At every event you both dance in the same division, whoever gets further wins the head-to-head. A friendly rival counts the same: it's just how you feel about it.</p>
    ${suggestCard() ? `<div class="news">${suggestCard()}</div>` : act.length < E.RIVAL_MAX ? `<p class="muted tiny">New rivals suggest themselves: someone who keeps finishing just ahead of you.</p>` : ''}
    ${act.map(card).join('')}
    ${past.length ? `<section class="block"><h2>Former rivals</h2><ul class="people">${past.map(({ R }) => `<li><span><b>${esc(R.name)}</b>${R.wasMain ? ' <span class="muted tiny">was your main rival</span>' : ''} <span class="muted tiny">stopped tracking ${seasonNo() > 1 ? `season ${R.former.season}, ` : ''}week ${R.former.week}</span></span><span class="num">${R.w}–${R.l}</span></li>`).join('')}</ul></section>` : ''}`;
}
function hubTab(tab) {
  if (tab === 'me') { S.readsNew = Object.entries(S.reads || {}).filter(([, r]) => !(S.meSeen || '').split(',').includes(readKey(r))).map(([k]) => k); S.meSeen = meKey(); }
  const body = tab === 'season' ? seasonTab()
    : tab === 'me' ? `${dancerCard()}${shop()}${people()}${diary()}`
    : tab === 'rivals' ? rivalsTab()
    : `${moneyAlert()}${surpriseCard()}${focusCard()}${tipCard('week')}${introCards()}${newRivalCard()}${news()}${moveCard()}${comingUp()}${planner()}`;
  return `${topbar()}${body}${tabbar(tab)}`;
}

  return `<section class="block"><div class="sec-head"><h2>Strictly</h2><button class="linkbtn" data-sheets="1">Scoresheets</button></div><p style="font-size:.9rem">With <b>${esc(r.partner)}</b>: ${r.out ? `out in the prelims (${E.ordinal(r.rank)} of ${r.size})` : `${E.ordinal(r.place)} in the final${r.prelim ? ` (${r.size} couples entered)` : ` of ${r.size} couples`}`}${r.prize ? `, <b class="num">$${r.prize}</b> as your half of the prize` : ''}.</p></section>`;
}
function prankRecap(wk) {
  const mine = wk.prank, got = wk.prankedBy && wk.prankedBy.done; if (!mine && !got) return '';
  // Every line says what happened and who did it (Steve, v57): payback names the room and the event it paid back.
  const p = wk.prankedBy, what = got && (p.short || p.text.replace(/^Payback[^:]*: /, '').split('. ')[0].replace(/\.$/, ''));
  const lines = [mine && `<b>Prank of the weekend:</b> ${esc(mine.short)}.`,
    got && (p.payback ? `<b>Payback</b> from ${esc(p.from || 'a room you pranked')}: ${esc(what)}.` : `<b>${mine ? 'You got pranked too' : 'You got pranked'}:</b> ${esc(what)}. Still laughing.`)].filter(Boolean);
  const named = mine && mine.id === 'ducks' ? tyroneNote() : '';
  return `<section class="prank recap"><p>${lines.join(' ')}</p></section>${named}`;
}
// Season wrap-up: Tyrone comes home.
function tyroneHome(n) {
  const t = S.tyrone; if (!t || t.season !== n) return '';
  return `<section class="block tyhome"><div class="polaroid big">${tyPic('home')}<span class="cap">Home. He’s seen things.</span></div>
    <p>${t.sightings ? `Tyrone came home this season, after ${t.sightings} sighting${t.sightings > 1 ? 's' : ''}.` : 'Tyrone came home. He won’t say where he’s been.'}</p></section>`;
}

function render() {
  app.innerHTML = screens[V.screen]();
  if (S && V.screen === 'hub') V.pulseWeek = E.absWeek(S); // the meter's surprise pulses once a week, not on every tap
  if (V.screen === 'dance') startDance();
  save();
}

/* ---------- saving ---------- */
// The season is saved in this browser after every screen, so a refresh or a closed tab
// doesn't lose it. One save slot: starting a new season replaces it. Storage can be
// blocked (private windows, previews), so every access is wrapped and the game just
// carries on unsaved.
const SAVE_KEY = 'anchor-point-save';
let saved = null; // a season found in storage, offered on the start screen
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, S, V })); } catch (e) {}
}
function readSave() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && d.v === 1 && validState(d) ? d : null; } catch (e) { return null; }
}
function clearSave() {
  saved = null;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
const validState = d => !!(d && d.S && d.S.sc !== undefined && d.S.stats && d.S.stats.time !== undefined);
function loadGame(d) {
  S = d.S; if (!S.gear) S.gear = {};
  S.season = S.season || 1; S.div = S.div || 'Novice'; // saves from before careers
  V = d.V || { screen: 'hub' }; if (!V.plan) V.plan = E.emptyPlan();
  if (!screens[V.screen] || V.screen === 'start') V.screen = 'hub';
  if (V.screen === 'rivals') { V.screen = 'hub'; V.tab = 'rivals'; } // saves from before the tabs (v56)
  if (!V.tab) V.tab = 'week';
  if (V.screen === 'dance') V.screen = V.ev && V.ev.strictly ? 'stDraw' : 'draw'; // the animation can't resume halfway; replay it from the draw
  if (S.wk && V.ev) V.ev = S.wk.res;          // saving splits these into two copies; make them one object again
  E.resume(S);
}

/* ---------- flow ---------- */
function newWeekPlan() { V.plan = E.emptyPlan(); }
function afterWeek() {
  if (E.eventAt(S, S.week)) return go('eventIntro');
  E.endWeek(S);
  if (S.done) go('end'); else if (S.seasonDone) go('season'); else { newWeekPlan(); go('hub', { tab: 'week' }); }
}
function afterEvent() {
  if (S.moved && S.moved.seen === false) return go('promo', { promoBack: 'event' }); // you just moved up: celebrate first
  if (S.done) go('end');
  else if (S.seasonDone) go('season');
  else { E.endWeek(S); newWeekPlan(); go('hub', { tab: 'week' }); }
}
function showStage(i) { go('callbacks', { stage: i }); }
function setSlot(slot, val) {
  const p = { ...V.plan };
  if (slot === 'cls') p.cls = val === '1';
  else if (slot === 'social') { p.social = val === '1'; if (!p.social) p.mock = false; }
  else if (slot === 'mock') p.mock = val === '1';
  else if (slot === 'prac') p.prac = val;
  else if (slot === 'priv') p.priv = val || null;
  V.plan = p; render();
}

app.addEventListener('submit', e => {
  if (e.target.id !== 'startForm') return;
  e.preventDefault();
  const name = (document.getElementById('nm').value || 'Alex').trim().slice(0, 16) || 'Alex';
  const role = document.getElementById('roleFollow').checked ? 'Follow' : 'Lead';
  if (saved && !saved.S.done) { V.confirmNew = { name, role }; return render(); } // don't wipe a career in progress without asking
  newCareer(name, role);
});
function newCareer(name, role) { saved = null; S = E.newGame(name, role); newWeekPlan(); go('pickRival', { tone: 'friendly', label: null, labelOwn: '', tab: 'week', confirmNew: null, helpBack: null }); }
app.addEventListener('input', e => { if (e.target.id === 'rivalLabel') V.labelOwn = e.target.value; });
// Remember which fold-away sections are open. 'toggle' doesn't bubble, so listen in the capture phase.
app.addEventListener('toggle', e => {
  const t = e.target; if (!t.dataset || !t.dataset.sec) return;
  V.open = { ...(V.open || {}), [t.dataset.sec]: t.open };
  if (t.dataset.sec === 'shop' && t.open && S) { S.shopSeen = [...(S.shopSeen || []), ...shopNew()]; t.querySelectorAll('.newtag').forEach(x => x.remove()); }
  save();
}, true);
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.help) return V.screen === 'tips' ? undefined : go('tips', { helpBack: V.screen });
  if (d.tipsback) return go(V.helpBack && screens[V.helpBack] ? V.helpBack : 'hub');
  if (d.tipsoff) { tipsOff = true; flagSet(TIPS_OFF_KEY, true); return render(); }
  if (d.slot === 'tipsw') { tipsOff = d.val === 'off'; flagSet(TIPS_OFF_KEY, tipsOff); return render(); }
  if (d.tab && !tabsSeen) { tabsSeen = true; flagSet(TABS_KEY, true); }
  if (d.tab) return go('hub', { tab: d.tab, confirmStop: null, editLabel: d.tab === V.tab ? V.editLabel : null });
  if (d.tip) { seeTip(d.tip); if (d.tipat === 'week') V.tipWeek = E.absWeek(S); return render(); }
  if (d.planned) return go('hub', { tab: 'week' });
  if (d.newno) { V.confirmNew = null; return render(); }
  if (d.newyes && V.confirmNew) { const { name, role } = V.confirmNew; V.confirmNew = null; return newCareer(name, role); }
  if (d.slot === 'hotel') { V.single = d.val === '1'; return render(); }
  if (d.slot === 'tone') { if (V.tone !== d.val) V.label = null; V.tone = d.val; return render(); }

  if (d.relabelown) { const el = document.getElementById('relabelOwn'); E.describeRival(S, d.relabelown, el && el.value); V.editLabel = null; return render(); }
  if (d.relabelno) { V.editLabel = null; return render(); }
  if (d.editlabel) { V.editLabel = d.editlabel; return render(); }
  if (d.pickmain || d.ownrival) {
    const lab = (V.labelOwn || '').trim() || V.label || E.RIVALRY[V.tone || 'rival'][0];
    if (d.pickmain) E.pickMain(S, d.pickmain, V.tone, lab);
    else { const el = document.getElementById('rivalName'), nm = (el && el.value || '').trim(); if (!nm) return el && el.focus(); E.pickMain(S, { name: nm }, V.tone, lab); }
