  }
  if (d.track) { if (E.trackRival(S, d.track, d.tone)) V.editLabel = d.track; return render(); } // then describe it (v55)
  if (d.decline) { if (S.near && S.near[d.decline]) S.near[d.decline].no = true; S.suggest = null; return render(); }
  if (d.stop) { if (S.rivalry[d.stop] && S.rivalry[d.stop].main) { V.confirmStop = d.stop; return render(); } E.stopRival(S, d.stop); return render(); }
  if (d.stopok) { E.stopRival(S, d.stopok); V.confirmStop = null; return render(); }
  if (d.stopno) { V.confirmStop = null; return render(); }
  if (d.promodone) { S.moved.seen = true; return V.promoBack === 'event' ? afterEvent() : go(V.promoBack === 'eventIntro' ? 'eventIntro' : 'hub', { tab: 'week' }); }
  if (d.slot) return setSlot(d.slot, d.val);
  if (d.buy) { E.buyGear(S, d.buy); return render(); }
  if (d.stand) { E.buyStand(S, d.stand); return render(); }
  if (d.evt) { E.answerEvent(S, d.evt === 'yes'); return render(); }
  if (d.same) { V.plan = E.sanitizePlan(S, S.lastPlan); return render(); }
  if (d.intro && S.pals && S.pals[d.intro]) { S.pals[d.intro].seen = true; save(); return render(); }
  if (d.lock) { if (S.evt && !S.evt.resolved) E.answerEvent(S, false); const chk = E.checkPlan(S, V.plan); if (!chk.ok) return; const r = E.applyWeek(S, V.plan); return go('weekDone', { result: r }); }
  if (d.next) return afterWeek();
  if (d.register) { const ev = E.eventAt(S, S.week); E.startEvent(S, { single: !!V.single && ev.travel !== 'home' }); V.single = false; V.ev = S.wk.res; V.review = null; return go('weekend'); }
  if (d.pick) { E.chooseSlot(S, d.pick); return render(); }
  if (d.strictly) { E.enterStrictly(S, d.strictly); return render(); }
  if (d.strictlyno) { V.strictlyNo = E.absWeek(S); return render(); }
  if (d.strictlysee) return go('strictly');
  if (d.round) {
    const x = E.danceRound(S); V.ev = S.wk.res;
    if (x.round === 'Strictly') return go(x.stage === 'prelim' || x.out ? 'strictly' : 'stDraw');
    if (x.round === 'Prelims') return showStage(0);
    if (x.round === 'Semifinal') return go('semi');
    return go('draw');
  }
  if (d.wk) return go('weekend');
  if (d.sheets) return go('sheets');
  if (d.sumback) return go('weekendSum');
  if (d.wrap) { E.finishEvent(S); return go('weekendSum'); }
  if (d.skip) { E.skipEvent(S); return afterEvent(); }
  if (d.moveup) { E.moveUp(S); return S.done ? go('end') : go('promo', { promoBack: V.screen }); }
  if (d.cal) { E.setGoing(S, d.cal, d.on === '1'); return render(); }
  if (d.door) { E.doorPass(S, d.door, d.on === '1'); return render(); }
  if (d.snooze) { V.snooze = { season: seasonNo(), week: nextEventWeek() || E.WEEKS }; return render(); }
  if (d.nextseason) { E.newSeason(S); newWeekPlan(); return go('planSeason'); }
  if (d.semi) return go('semi');
  if (d.stage) return showStage(Number(d.stage));
  if (d.review) { const rv = E.buyReview(S, V.ev, d.review); if (rv) V.review = rv; return render(); }
  if (d.draw) return go('draw');
  if (d.dance) { if (V.screen === 'stDraw') V.ev = stDanceEv(); return go('dance'); }
  if (d.skipdance) return finishDance(true);
  if (d.scores) { if (V.ev && V.ev.strictly) { V.ev = S.wk.res; return go('strictly'); } return go('danced'); }
  if (d.awards) { E.awards(S); return go('awards'); }
  if (d.results) return go('results');
  if (d.awardsback) return go('awards');
  if (d.evdone) return afterEvent();
  if (d.restart) { clearSave(); S = null; return go('start'); }
  if (d.continue) {
    try { loadGame(saved); saved = null; return render(); }
    catch (err) { clearSave(); S = null; V = { screen: 'start' }; return render(); } // a broken save: drop it, start fresh
  }
});

/* ---------- dance floor ---------- */
const DUR = 14;
let danceState = null;
function finishDance(skip) {
  if (!danceState) return;
  const { feed, moments, shown } = danceState;
  if (skip) for (let i = shown.n; i < moments.length; i++) addMoment(feed, moments[i]);
  shown.n = moments.length;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  const c = document.getElementById('count'); if (c) c.textContent = 'Final pose';
  document.getElementById('scoresBtn').hidden = false;
  document.getElementById('skipBtn').hidden = true;
  danceState.done = true;
  if (skip) danceState.draw && danceState.draw(DUR);
}
// Moments land under their song; each new song appears on top, so the one playing stays nearest the floor.
function songGroup(feed, si) {
  const r = V.ev; let grp = document.getElementById('grp' + si);
  if (grp) return grp;
  grp = document.createElement('li'); grp.className = 'grp'; grp.id = 'grp' + si;
  grp.innerHTML = (r.songs ? songCard(r.songs[si], songHead(r, si), r.fit && r.fit[si], true, undefined, true) : '') + '<ul class="feed"></ul>';
  feed.prepend(grp);
  const sl = document.getElementById('songline'); if (sl && r.songs) sl.textContent = songLabel(r, si);
  return grp;
}
function addMoment(feed, m) {
  const r = V.ev; const si = r.songs && m.song !== undefined ? m.song : 0;
  if (r.songs) for (let k = 0; k < si; k++) songGroup(feed, k); // skipping ahead still lists songs in order
  songGroup(feed, si).querySelector('ul').insertAdjacentHTML('beforeend', momentLi(m));
}
function startDance() {
  const r = V.ev; const cv = document.getElementById('floor'); const feed = document.getElementById('feed'); const countEl = document.getElementById('count');
  const css = getComputedStyle(document.documentElement); const col = n => css.getPropertyValue(n).trim();
  const C = { floor: col('--floor'), line: col('--floor-line'), me: col('--accent'), partner: col('--partner'), good: col('--good'), bad: col('--bad'), text: col('--floor-text') };
  const ctx = cv.getContext('2d'); const dpr = Math.min(2, window.devicePixelRatio || 1); let W = 0, H = 0;
  const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); window.addEventListener('resize', size, { once: true });

  // The set is split evenly across the dance; each song plays at its own tempo.
  const songs = r.songs || [r.song], segLen = DUR / songs.length;
  const songAt = t => Math.min(songs.length - 1, Math.floor(t / segLen));
  const kinds = ['sugar', 'pass', 'whip', 'tuck', 'pass', 'sugar', 'pass', 'whip', 'tuck'];
  const seq = []; let t = 0, side = 1, i = 0;
  while (t < DUR + 2) {
    const beat = 60 / (songs[songAt(t)].bpm * 1.35);
    const p = kinds[(i++ + Math.floor(Math.random() * 3)) % kinds.length]; const counts = p === 'whip' ? 8 : 6;
    seq.push({ p, start: t, dur: counts * beat, counts, side }); if (p === 'pass') side = -side; t += counts * beat;
  }
  const labels6 = ['1', '2', '3 &', '4', '5 &', '6'], labels8 = ['1', '2', '3 &', '4', '5', '6', '7 &', '8'];
  const mTimes = r.moments.map((_, k) => 1.4 + k * 2.1);
  const shown = { n: 0 }; const rings = []; const trails = { f: [], l: [] };
  const meLead = S.role === 'Lead';

  function pose(pt, u) {
    const c = .5, s = pt.side, E1 = .34;
    let fx, fy = 0, lx, ly = 0;
    if (pt.p === 'sugar' || pt.p === 'tuck') {
      const k = Math.sin(Math.PI * u); fx = c + s * (E1 - .22 * k); lx = c - s * .06 + s * .02 * k;
    } else if (pt.p === 'pass') {
      fx = c + s * E1 * Math.cos(Math.PI * u); lx = c - s * .06 * Math.cos(Math.PI * u); ly = -34 * Math.sin(Math.PI * u); fy = 6 * Math.sin(Math.PI * u);
    } else {
      const pcx = c - s * .02, rr = .04;
      if (u < .3) { const q = u / .3; fx = c + s * (E1 - (E1 - .02) * q); lx = c - s * .06; }
      else if (u < .8) { const a = (u - .3) / .5 * Math.PI * 2; fx = pcx + s * rr * Math.cos(a); lx = pcx - s * rr * Math.cos(a); fy = 1; ly = 1; pt._a = a; }
      else { const q = (u - .8) / .2; fx = c + s * (.02 + (E1 - .02) * q); lx = c - s * .06; }
    }
    return { fx, fy, lx, ly };
  }
  function draw(el) {
    const x0 = W * .06, x1 = W * .94, sw = x1 - x0, cy = H * .55, half = 30;
    ctx.fillStyle = C.floor; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.globalAlpha = .35;
    for (let x = 0; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, cy - half); ctx.lineTo(x1, cy - half); ctx.moveTo(x0, cy + half); ctx.lineTo(x1, cy + half); ctx.stroke(); ctx.setLineDash([]);
    const pt = seq.find(p => el >= p.start && el < p.start + p.dur) || seq[seq.length - 1];
    const u = Math.min(1, (el - pt.start) / pt.dur);
    const ps = pose(pt, u);
    let F = [x0 + ps.fx * sw, cy + ps.fy], L = [x0 + ps.lx * sw, cy + ps.ly];
    if (pt.p === 'whip' && u >= .3 && u < .8) { const a = pt._a, R = .04 * sw; F[1] = cy - Math.sin(a) * R * pt.side; L[1] = cy + Math.sin(a) * R * pt.side; }
    const mx = (F[0] + L[0]) / 2, my = (F[1] + L[1]) / 2;
    const g = ctx.createRadialGradient(mx, my, 4, mx, my, 110); g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 110, 0, Math.PI * 2); ctx.fill();
    if (!reduced) {
      trails.f.push(F); trails.l.push(L); if (trails.f.length > 14) { trails.f.shift(); trails.l.shift(); }
      ['f', 'l'].forEach(k => trails[k].forEach((p, idx) => { ctx.globalAlpha = idx / trails[k].length * .25; ctx.fillStyle = ((k === 'l') === meLead) ? C.me : C.partner; ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2); ctx.fill(); }));
      ctx.globalAlpha = 1;
    }
    for (let k = rings.length - 1; k >= 0; k--) {
      const rg = rings[k]; const a = (el - rg.t) / .8; if (a > 1) { rings.splice(k, 1); continue; }
      ctx.strokeStyle = rg.c; ctx.globalAlpha = 1 - a; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(mx, my, 24 + a * 50, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    const dot = (p, fill, label) => {
      ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.text; ctx.font = '700 11px "DM Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, p[0], p[1] - 18);
    };
    const pName = r.partner.name;
    if (meLead) { dot(F, C.partner, pName); dot(L, C.me, 'You'); } else { dot(L, C.partner, pName); dot(F, C.me, 'You'); }
    if (pt.p === 'tuck' && u > .45 && u < .8) { ctx.strokeStyle = meLead ? C.partner : C.me; ctx.lineWidth = 2; const a0 = (u - .45) / .35 * Math.PI * 4; ctx.beginPath(); ctx.arc(F[0], F[1], 16, a0, a0 + 1.6); ctx.stroke(); }
    const bi = Math.min(pt.counts - 1, Math.floor(u * pt.counts));
    if (countEl && el < DUR) countEl.textContent = (pt.counts === 8 ? labels8 : labels6)[bi];
  }
  danceState = { feed, moments: r.moments, shown, done: false, draw };
  const t0 = performance.now();
  const frame = now => {
    const el = (now - t0) / 1000;
    if (r.songs) for (let k = 0; k <= songAt(Math.min(el, DUR - .01)); k++) songGroup(feed, k);
    while (shown.n < r.moments.length && el >= mTimes[shown.n]) {
      const m = r.moments[shown.n]; addMoment(feed, m); rings.push({ t: el, c: m.ok ? C.good : C.bad }); shown.n++;
    }
    draw(Math.min(el, DUR));
    if (el >= DUR) { finishDance(false); return; }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(data) {
  // A live artifact update hands over the running game directly; otherwise offer the saved one.
  if (validState(data)) loadGame(data);
  else saved = readSave();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, V }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
