        <p style="font-size:.84rem">Strongest at <b>${E.LABEL[p.strong]}</b></p>
        ${p.priya ? `<p class="chip good" style="align-self:flex-start">Your practice partner!</p>` : p.met ? `<p class="chip good" style="align-self:flex-start">You've danced together</p>` : ''}
        <p style="font-size:.78rem" class="muted">Weakest at ${E.LABEL[E.STATS.slice().sort((a, b) => p.stats[a] - p.stats[b])[0]]}</p>
      </div></div></div>
      <div class="flip"><div class="inner"><div class="drawcard">
        <p class="eyebrow">The DJ's set</p>
        ${Array.from({ length: n }, (_, i) => `<div class="mystery"><span class="n">${i + 1}</span><span class="muted">${n > 1 ? 'Song ' + (i + 1) : 'One song'}: ?</span></div>`).join('')}
        <p class="muted" style="font-size:.78rem">Nobody hears ${n > 1 ? 'them' : 'it'} until the DJ hits play.</p>
      </div></div></div>
    </div>
    ${p.met ? `<p style="font-size:.86rem">${p.metWhere && p.metWhere.length ? `You've danced with ${esc(p.name)} ${timesText(p.metWhere.length)} this season (${p.metWhere.map(esc).join('; ')})` : `You and ${esc(p.name)} danced at a social this weekend`}, so you already know each other's lead and follow: <b>a Connection boost</b> as a couple.</p>` : ''}
    <p class="muted" style="font-size:.86rem">${n > 1 ? 'Each song asks for something different, and you only learn what when it starts.' : 'You only learn what the song asks for when it starts.'} You don't pick the moves; the floor shows whether the training was enough.</p>
    <p class="muted" style="font-size:.86rem">${r.rescue.gap > 0 ? `Partner rescue: you're ${r.rescue.gap >= 10 ? 'a lot' : r.rescue.gap >= 4 ? 'clearly' : 'a little'} stronger than ${esc(p.name)}. Your Composure lets you carry ${r.rescue.pct >= 38 ? 'nearly half' : r.rescue.pct >= 25 ? 'about a third' : r.rescue.pct >= 12 ? 'some' : 'a little'} of that gap.` : `${esc(p.name)} is as strong as you or stronger, so there's nothing to carry.`}</p>
    <button class="btn primary wide" data-dance="1">Take the floor</button>`;
  },
  dance() {
    const r = V.ev;
    return `<p class="eyebrow">${esc(r.ev.name)} · ${r.spotlight ? 'spotlight final' : 'final'}</p>
    <div class="floorwrap"><canvas id="floor" aria-label="Top-down view of your couple dancing in the slot"></canvas>
      <span class="songline" id="songline">${esc(r.songs ? songLabel(r, 0) : r.song.title + ' · ' + r.song.genre)}</span><span class="count" id="count">5, 6</span></div>
    <ul class="feed" id="feed" aria-live="polite"></ul>
    <button class="btn primary wide" id="scoresBtn" data-scores="1" hidden>See the scores</button>
    <button class="btn ghost wide" id="skipBtn" data-skipdance="1">Skip to the scores</button>`;
  },
  results() {
    const r = V.ev; const J = E.JUDGES;
    const pc = r.place <= 3 ? 'p' + r.place : '';
    return `${topbar()}
    <section class="block">
      <p class="eyebrow">${esc(r.ev.name)} · ${r.ev.div || 'Novice'} J&amp;J final</p>
      <div class="placing"><span class="place ${pc}">${E.ordinal(r.place)}</span>
        <div><p><b>${esc(S.name)} &amp; ${esc(r.partner.name)}</b></p><p class="muted">${r.points ? `+${r.points} point${r.points > 1 ? 's' : ''} · ${S.points}/${target()} ${divNow()}` : `No points this time · ${S.points}/${target()} ${divNow()}`}${r.prize ? ` · $${r.prize} prize` : ''}</p></div></div>
    </section>
    ${setRecap(r)}
    <section class="block">
      <h2>Scoresheet</h2>
      ${(() => { const me = r.table.find(x => x.isPlayer), lo = Math.min(...me.ranks), hi = Math.max(...me.ranks);
        return r.spotlight ? `<p class="muted" style="font-size:.86rem">Spotlight: every judge saw every moment, so the marks are close.</p>`
          : hi - lo >= 4 ? `<p style="font-size:.86rem"><b>The judges split on you:</b> marks from ${E.ordinal(lo)} to ${E.ordinal(hi)}. On a full floor each judge catches different moments: some saw your best, some your worst.</p>` : ''; })()}
      <div class="tablewrap"><table>
        <thead><tr><th>Pl</th><th class="cp">Couple</th>${J.map(j => `<th title="${j.name}">${j.name.slice(0, 3)}</th>`).join('')}<th title="Judges at this place or better">Maj.</th></tr></thead>
        <tbody>${r.table.map(row => `<tr class="${row.isPlayer ? 'me' : row.lead.priya || row.follow.priya ? 'pr' : ''}"><td class="pl">${row.place}</td>
          <td class="cp">${esc(row.lead.name)}${row.lead.rival ? '<span class="rtag">rival</span>' : ''}${row.lead.priya ? '<span class="rtag friendly">practice partner</span>' : ''} &amp; ${esc(row.follow.name)}${row.follow.rival ? '<span class="rtag">rival</span>' : ''}${row.follow.priya ? '<span class="rtag friendly">practice partner</span>' : ''} <span class="muted num" style="font-size:.72rem">#${row.lead.bib}/#${row.follow.bib}</span></td>
          ${row.ranks.map(x => `<td class="r ${x <= row.why.col ? 'cnt' : 'dim'}">${x}</td>`).join('')}<td class="maj">${row.why.cnt} at ${E.ordinal(row.why.col)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="muted" style="font-size:.8rem">Each judge ranks couples 1–8. Bold ranks are the ones that counted. Relative placement awards each place to the couple with a majority (3 of 5) of judges at that rank or better.</p>
    </section>
    <section class="block"><h2>Judges' notes</h2>
      <ul class="notes">${r.notes.map(n => `<li class="${n.good ? 'good' : 'bad'}"><span><b>${n.judge}:</b> ${esc(n.text)}</span></li>`).join('')}</ul>
    </section>
    <button class="btn primary wide" data-wk="1">Back to the weekend</button>`;
  },
  weekend() {
    const wk = S.wk, r = wk.res, ev = r.ev;
    const doneAll = wk.cur >= wk.slots.length;
    const ef = Math.round((1 - E.energyFactor(S.energy)) * 100);
    const rows = wk.slots.map((sl, i) => {
      const state = i < wk.cur ? 'past' : i === wk.cur ? 'now' : 'next';
      let body = '';
      if (sl.done && sl.result && sl.result.round) {
        const x = sl.result;
        body = x.round === 'Final' ? `<b>Final: ${E.ordinal(x.place)}</b><span class="muted"> · +${x.points} pts</span>`
          : `<b>${x.round}: ${E.ordinal(x.info.rank)} of ${x.info.size}</b><span class="muted"> · ${x.info.advanced ? (x.info.pulledIn ? 'in as alternate' : 'through') : 'out'}</span>`;
      } else if (sl.done && sl.result) {
        const x = sl.result;
        body = `<b>${esc(x.title)}</b><p class="muted tiny">${esc(x.note)}</p><div class="chips">${Object.entries(x.d).map(([k, v]) => gainChip(k, v)).join('')}${x.sc ? `<span class="chip ${x.sc > 0 ? 'good' : 'bad'}">Community ${signed(x.sc)}</span>` : ''}${x.energy ? `<span class="chip">${signed(x.energy)} energy</span>` : ''}${x.money ? `<span class="chip">−$${x.money}</span>` : ''}</div>`;
      } else if (state === 'now' && sl.round) {
        const rd = sl.round; const cut = rd === 'Prelims' ? (r.hasSemi ? 16 : 8) : rd === 'Semifinal' ? 8 : null;
        body = `<b>${rd}</b><p class="muted tiny">${rd === 'Final' ? 'Random partner, songs from the DJ, five judges.' : `${rd === 'Prelims' ? ev.field : 16} dancers, top ${cut} go through.`} Costs ${E.ROUND_ENERGY[rd]} energy to dance.${ef ? ` At ${S.energy} energy you're about ${ef}% below your best.` : ''}</p>
          <button class="btn primary wide" data-round="1">${rd === 'Final' ? 'Draw your partner' : 'Dance the ' + rd.toLowerCase()}</button>`;
      } else if (state === 'now') {
        const nx = wk.slots.slice(i + 1).find(x => x.round);
        const ahead = nx ? `<p class="hint">Next round: <b>${nx.round}</b> (${nx.t}). At ${S.energy} energy you'd dance at ${Math.round(E.energyFactor(S.energy) * 100)}% of your best.</p>` : '';
        body = `${ahead}<div class="stack" style="gap:8px">${E.slotOptions(S, i).map(o => `<button class="opt" data-pick="${o.id}" ${o.ok ? '' : 'disabled'}>
          <span class="t">${esc(o.title)}</span><span class="c">${o.money ? '$' + o.money + ' · ' : ''}${o.energy < 0 ? '+' + (-o.energy) : o.energy ? '−' + o.energy : '±0'} energy</span>
          <span class="d">${esc(o.desc)}${o.ok ? shortNote(o.money) : ` <b style="color:var(--bad)">${o.why}.</b>`}</span></button>`).join('')}</div>`;
      } else {
        body = sl.round ? `<b>${sl.round}</b>` : `<span class="muted">${sl.wasRound ? 'Free (you’re out of the ' + sl.wasRound.toLowerCase() + ')' : sl.night ? 'Free · social night' : 'Free · workshops'}${sl.star ? ' · star workshop' : ''}${sl.priya ? N(' · {priya}’s final') : ''}${sl.offer ? ' · pro offer' : ''}</span>`;
      }
      return `<li class="${state} ${sl.round ? 'round' : ''}"><span class="when">${sl.t}</span><div class="wb">${body}</div></li>`;
    }).join('');
    return `${topbar()}
    <section class="block">
      <p class="eyebrow">Tier ${ev.tier} · ${ev.div || 'Novice'} J&amp;J${r.out ? ' · you’re out, weekend is yours' : ''}</p>
      <h1>${esc(ev.name)}</h1>
      ${wk.news.length ? `<div class="news">${wk.news.map(n => `<div class="banner"><span class="chip acc">${n.tag}</span><span>${esc(n.text)}</span></div>`).join('')}</div>` : ''}
      <p class="muted tiny">Visiting pro this weekend: ${esc(wk.pro.name)}, who teaches ${E.LABEL[wk.pro.topic].toLowerCase()}.</p>
    </section>
    ${stand()}
    <section class="block"><ol class="timeline">${rows}</ol>
    ${doneAll ? `<button class="btn primary wide" data-wrap="1">Head home</button>` : ''}</section>`;
  },
  weekendSum() {
    const wk = S.wk, r = wk.res, sm = wk.summary;
    const ex = E.exitOf(r);
    return `${topbar()}
    <section class="block">
      <p class="eyebrow">${esc(r.ev.name)} · weekend wrap-up</p>
      <h1>${r.madeFinal ? `${E.ordinal(r.place)} in the final` : `Out in the ${ex.name.toLowerCase()}`}</h1>
      <p>${r.points ? `+${r.points} points.` : 'No points this time.'} ${doorNews(r)}${r.prize ? ` Plus <b class="num">$${r.prize}</b> in prize money.` : ''}</p>
      <div class="chips">${Object.entries(sm.d).map(([k, v]) => gainChip(k, v)).join('')}${sm.sc ? `<span class="chip ${sm.sc > 0 ? 'good' : 'bad'}">Community ${signed(sm.sc)}</span>` : ''}<span class="chip">Energy ${sm.energyStart} → ${sm.energyEnd}</span>${sm.spent ? `<span class="chip">−$${sm.spent} this weekend</span>` : ''}${moodChips(sm.moods)}</div>
      ${r.priya && S.priyaNews && S.priyaNews.week === S.week && S.priyaNews.season === seasonNo() ? `<p style="font-size:.86rem"><b>${N('{priya}')}:</b> ${esc(S.priyaNews.text.replace(/^[^:]+ at [^:]+: /, ''))}</p>` : ''}
      <p class="muted tiny">Includes a little Composure from competing and +${E.SC.event} community for showing up. You'll recover ${E.RECOVER} energy before Monday.</p>
    </section>
    ${rivalWrap(r)}
    ${r.rounds.some(x => x.sheet) ? `<button class="btn wide" data-sheets="1">See the scoresheets</button>` : ''}
    ${reviewBlock()}
    <button class="btn primary wide" data-evdone="1">${S.done ? 'Career wrap-up' : S.seasonDone ? 'Season wrap-up' : 'Back to training'}</button>`;
  },
  tips() {
    const at = n => '×' + (.6 + n / 100).toFixed(2); // Dev's investment at a given community level
    const devNow = S.devUnlocked ? N(`Right now {dev:they}'d invest ×${E.devMult(S).toFixed(2)}.`) : `You're at ${Math.round(S.sc)} community.`;
    const sec = (title, items) => `<section class="block howto"><h2>${title}</h2><ul>${items.map(t => `<li>${t}</li>`).join('')}</ul></section>`;
    const pals = [ // only the partners you've met (Steve, v48)
      E.knows(S, 'priya') && N(`<b>{priya}</b> (${S.priya.div}, $${E.PRACTICE.priya.cost}, −${E.PRACTICE.priya.energy} energy) trains Technique and Connection. {priya:They} started a step ahead of you in Novice, competes on the same circuit, and usually points out around the middle of your first season. {priya:They} teaches at {priya:their} own level, which keeps rising as {priya:they} improves, so {priya:they} stays useful until you pass {priya:them}. Your chemistry grows every time you practice together, up to 3/3. Cheering {priya:their} final when {priya:they}'s in another division adds chemistry too.`),
      S.devUnlocked && N(`<b>{dev}</b> (Advanced, $${E.PRACTICE.dev.cost}, −${E.PRACTICE.dev.energy}) is the musicality nerd: Musicality and Timing, with a little Connection. {dev:They} only practices with Intermediates and up, and how much {dev:they} invests grows with your community: ${at(35)} at 35, ${at(50)} at 50, ${at(70)} at 70. {dev:They} teaches well above Intermediate, so {dev:they} stays worth it. ${devNow}`),
      E.knows(S, 'lena') && N(`<b>{lena}</b> (All-Star, $${E.PRACTICE.lena.cost}, −${E.PRACTICE.lena.energy}) helped teach your beginner series and has a soft spot for you: {lena:they} knows you work hard. {lena:They} trains everything, and as an All-Star {lena:they} teaches far above your level, so {lena:they} never stops being worth it. {lena:They} only asks some weeks: going to the Friday social and a higher community make it more likely. Say yes when you can spare the money and energy.`),
    ].filter(Boolean);
    return `${topbar()}
    <p class="eyebrow">Game tips</p>
    <h1>Tips</h1>
    ${sec('Practice partners', [
      ...(pals.length ? pals : ['You don\u2019t have a practice partner yet. Someone from your studio will ask soon. Until then, solo drills always teach you something.']),
      S.devUnlocked && E.knows(S, 'lena') ? N(`A good rhythm: {priya} early to build chemistry, {lena} when {lena:they} has a free week and you can afford {lena:them}, and {dev} now that you're Intermediate.`) : 'You meet more practice partners as you go.',
      `Your community runs a mock J&amp;J night the week before the three biggest events (Sunset Coast, Rainforest, Pacific): mostly Composure, and it feels like the real thing.`,
    ])}
    ${sec('Your week', [
      `When energy is tight, keep the Friday social first and Tuesday class second. Drop practice first, and choose a rest night over solo drills: rest gives you 10 energy back, so you keep the rest of the week.`,
      `The Friday social is the heart of your week: Musicality, Composure, community, and it makes ${E.knows(S, 'lena') ? N('{lena}') : 'a practice partner'} more likely to ask.`,
      `Tuesday class is cheap on energy and builds community every week. Go even when the topic isn't the one you need.`,
      `A private every other week is about right. Aim it at your weakest skill (your shortest bar), or at one you haven't had a read on lately: your coach tells you where it stands.`,
      `Coaches' reads go stale. The one under each bar shows when you got it, and moving up a division wipes them: a skill that was \u201cChef\u2019s kiss\u201d in Novice starts over.`,
      `In an event week, taper: a rest night and nothing else, so you arrive fresh.`,
      `Mix up your week. The exact same plan as last week costs motivation, and four in a row costs a lot; a week with only one change (or just a different practice partner) costs a little. Event weeks don't break the routine.`,
      `The biggest weekends draw the best dancers from other regions, so a final there is harder to make than at a local event.`,
      `Share a room at events and you can prank another room from your community on a social night: big laughs, motivation way up. A single room sleeps better, but nobody pranks anyone.`,
      `Everything you train with has a level. Classes, workshops${E.knows(S, 'priya') ? N(' and {priya}') : ''} teach you a lot until you pass their level, then less and less. Solo drills and socials grow with you, so they always teach you something. The word under each practice option (a lot / some / little) shows how much it still teaches you. Coaches, visiting pros${S.devUnlocked ? N(', {dev}') : ''}${E.knows(S, 'lena') ? N(' and {lena}') : ''} teach far above you. Video reviews always land in full.`,
      `Moving up to a new division gives you a new class level and a new workshop track to learn from.`,
    ])}
    ${sec('Competition weekends', [
      `Rest before your rounds. Naps shrink each time (+15, then +8, then +4), so save them for right before prelims and your final. A night's sleep doesn't count as a nap.`,
      `Night socials are for spare energy. The die-hards stay late, so some of the people you dance with will be in the other role's final, and drawing someone you know helps.`,
      `Once you're out, or your rounds are done, spend freely: workshops, a private with the visiting pro, the Sunday night social.`,
      `The espresso's crash hits after your next round. Right before your last round of the weekend, the crash no longer matters.`,
      `Send your video to the coach. The two-week focus on what went wrong is worth the $${E.REVIEW.coach}.`,
    ])}
    ${sec('Rivals', [
      `Your main rival starts a step ahead of you. Keep training and you'll usually catch them partway through your first season. Rivals improve too, just never faster than you.`,
      `The head-to-head counts every event where you both dance the same division: whoever gets further wins it. A rival in another division doesn't count, but you'll hear how they did.`,
      `Someone who keeps finishing just ahead of you gets suggested as a rival. Track up to ${E.RIVAL_MAX}. Stop tracking anyone from the rivals screen: their record stays under Former rivals.`,
      `Friendly or bad blood, the record counts the same. Your rivalry's description (Grudge match, Hype buddy, or your own) sets the tone of the headlines and gossip. Change it any time on the rivals screen.`,
      `Milestones: your first win over a rival, the weekend you catch them, three in a row (either way), and who moves up first.`,
      `A friendly rival at an away event might share your hotel room: no snoring and a better night (+5 energy).`,
    ])}
    ${sec('Money', [
      `After entry fees, only about $50 a week is spare. Splurge some weeks and go light in others. The amber warning tells you when you'd miss an entry fee.`,
      `Prize money from the first two events helps pay for the next one.`,
      `Booking: you pay the pass (and the flight) at the booking deadline, the rest at the event. Once you've booked, the game keeps that money back. A surprise bill can still leave you short, so keep a little extra.`,
    ])}
    <button class="btn primary wide" data-tipsback="1">Back to the week</button>`;
  },
  sheets() {
    const r = V.ev, J = E.JUDGES, v = E.CALLBACK;
    const tbl = (rd, role = S.role) => `<section class="block"><h2>${rd.name}</h2>
      <p class="muted tiny">Top ${rd.cut} of ${rd.size} called back (the line). Each judge marks Yes = ${v.Yes}, Alt1 = ${v.Alt1}, Alt2 = ${v.Alt2}, Alt3 = ${v.Alt3}, the WSDC values. A Yes beats two alternates, and you're in if your total is above the line. The Chief Judge breaks ties.</p>
      <div class="tablewrap"><table class="sheet"><thead><tr><th>Bib</th><th class="cp">${role}</th>${J.map(j => `<th title="${j.name}">${j.name.slice(0, 2)}</th>`).join('')}<th>Σ</th></tr></thead>
      <tbody>${rd.sheet.map((x, i) => `<tr class="${x.me ? 'me' : x.priya ? 'pr' : ''}${i === rd.cut ? ' cutline' : ''}"><td class="pl">${x.bib}</td><td class="cp">${esc(x.name)}${x.rival ? '<span class="rtag">rival</span>' : ''}${x.priya ? '<span class="rtag friendly">practice partner</span>' : ''}${x.withdrew ? '<span class="rtag nem">withdrew</span>' : ''}${x.alt ? `<span class="rtag${x.in ? ' friendly' : ''}">${E.ordinal(x.alt)} alt${x.in ? ', in' : ''}</span>` : ''}</td>${x.marks.map(m => `<td class="mk-${m ? (m === 'Yes' ? 'yes' : 'alt') : 'no'}">${m}</td>`).join('')}<td class="r cnt">${x.sum}</td></tr>`).join('')}</tbody></table></div></section>`;
    // The other role's rounds, once they've been danced (they dance at the same time as yours).
    const other = S.role === 'Lead' ? 'Follows' : 'Leads', wk = S.wk && S.wk.res === r ? S.wk : null;
    const danced = name => !wk || wk.finished || wk.slots.findIndex(sl => sl.round === name || sl.wasRound === name) < wk.cur;
    const oSheets = (r.otherRounds || []).filter(rd => danced(rd.name));
    return `${topbar()}
    <p class="eyebrow">${esc(r.ev.name)} · scoresheets</p>
    <h1>Scoresheets</h1>
    <p class="muted" style="font-size:.86rem">Judges: ${J.map(j => j.name).join(', ')}.</p>
    ${r.rounds.filter(x => x.sheet).map(tbl).join('')}
    ${oSheets.length ? `<p class="eyebrow" style="margin-top:8px">${other}${r.priyaHere ? N(' ({priya} danced this one)') : ''}</p>${oSheets.map(rd => tbl({ ...rd, name: `${other}: ${rd.name}` }, other.slice(0, -1))).join('')}` : ''}
    <button class="btn primary wide" data-sumback="1">Back to the wrap-up</button>`;
  },
  season() {
    const n = seasonNo(), hist = thisSeason(n), got = hist.reduce((a, h) => a + (h.points || 0), 0), d = E.door(S);
    return `<section class="block">
      <p class="eyebrow">Season ${n} of ${E.CAREER}</p>
      <h1>Season ${n} wrap-up</h1>
      ${S.moved && S.moved.season === n ? `<p><b>You moved up to ${divNow()}</b> ${S.moved.forced ? `in week ${S.moved.week}: ${E.DIVS.Novice.must} Novice points makes you.` : `in week ${S.moved.week}.`} Expect a much stronger field next season.</p>` : ''}
      <p>You earned <b class="num">${got}</b> point${got === 1 ? '' : 's'} this season and you're on ${ptsNow()}. ${E.canMoveUp(S) ? `You can move up to ${d.next} whenever you like.` : d.next === 'Advanced' ? `${d.must} makes you move up to Advanced (the next version of the game).` : `${d.allow} lets you move up to ${d.next}.`} ${E.CAREER - n} season${E.CAREER - n === 1 ? '' : 's'} to go.</p>
      <p class="muted tiny">Everything carries over: your skills, money, energy, community and the people you know.</p>
    </section>
    ${seasonChart(n)}
    <section class="block"><h2>Events</h2>${eventLines(hist)}</section>
    ${seasonRivals(n)}${seasonPeople()}
    <button class="btn primary wide" data-nextseason="1">Start season ${n + 1}</button>`;
  },
  end() {
    const n = seasonNo(), div = divNow();
    const head = S.topped ? 'Off to Advanced!' : div === 'Novice' ? (S.promoted ? 'A Novice with points to spare' : 'Still a Novice, for now.') : 'An Intermediate dancer';
    const body = S.topped ? `${esc(S.name)} ${S.left && !S.left.forced ? `chose to move up to Advanced with ${S.points} Intermediate points` : `reached ${S.points} Intermediate points, and WSDC rules move you up to Advanced`}, in ${n} season${n > 1 ? 's' : ''}. Leaving Intermediate is where this game ends.`
      : `${esc(S.name)} danced ${n} season${n > 1 ? 's' : ''} and finished as ${div === 'Intermediate' ? 'an' : 'a'} ${div} on ${ptsNow()}.`;
    const seasons = Array.from({ length: n }, (_, i) => {
      const h = thisSeason(i + 1), pts = h.reduce((a, x) => a + (x.points || 0), 0), best = h.filter(x => x.madeFinal).sort((a, b) => a.place - b.place)[0];
      return `<li class="${pts ? 'good' : 'bad'}"><span><b>Season ${i + 1}</b> (${[...new Set(h.map(x => x.div || 'Novice'))].join(' → ') || div}): ${pts} points${best ? `, best ${E.ordinal(best.place)} at ${esc(best.name)}` : ', no finals'}</span></li>`;
    }).join('');
    return `<section class="block">
      <p class="eyebrow">Career over</p>
      <h1>${head}</h1>
      <p>${body}</p>
    </section>
    ${seasonChart() || dancerCard()}
    <section class="block"><h2>Seasons</h2>${S.winnings ? `<p class="muted">Prize money over your career: <b class="num">$${S.winnings}</b></p>` : ''}<ul class="notes">${seasons}</ul></section>
    ${seasonRivals(n)}${seasonPeople()}
    <button class="btn primary wide" data-restart="1">Start a new career</button>`;
  },

};


function render() {
  app.innerHTML = screens[V.screen]();
  if (V.screen === 'dance') startDance();
  save();
}

/* ---------- saving ---------- */
// The season is saved in this browser after every screen, so a refresh or a closed tab
// doesn't lose it. One save slot: starting a new season replaces it. Storage can be
// blocked (private windows, previews), so every access is wrapped and the game just
// carries on unsaved.
const SAVE_KEY = 'anchor-point-save';
let saved = null; // a season found in storage, offered on the start screen
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, S, V })); } catch (e) {}
}
function readSave() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); return d && d.v === 1 && validState(d) ? d : null; } catch (e) { return null; }
}
function clearSave() {
  saved = null;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
const validState = d => !!(d && d.S && d.S.sc !== undefined && d.S.stats && d.S.stats.time !== undefined);
function loadGame(d) {
  S = d.S; if (!S.gear) S.gear = {};
  S.season = S.season || 1; S.div = S.div || 'Novice'; // saves from before careers
  V = d.V || { screen: 'hub' }; if (!V.plan) V.plan = E.emptyPlan();
  if (!screens[V.screen] || V.screen === 'start') V.screen = 'hub';
  if (V.screen === 'dance') V.screen = 'draw'; // the animation can't resume halfway; replay it from the draw
  if (S.wk && V.ev) V.ev = S.wk.res;          // saving splits these into two copies; make them one object again
  E.resume(S);
}

/* ---------- flow ---------- */
function newWeekPlan() { V.plan = E.emptyPlan(); }
function afterWeek() {
  if (E.eventAt(S, S.week)) return go('eventIntro');
  E.endWeek(S);
  if (S.done) go('end'); else if (S.seasonDone) go('season'); else { newWeekPlan(); go('hub'); }
}
function afterEvent() {
  if (S.moved && S.moved.seen === false) return go('promo', { promoBack: 'event' }); // you just moved up: celebrate first
  if (S.done) go('end');
  else if (S.seasonDone) go('season');
  else { E.endWeek(S); newWeekPlan(); go('hub'); }
}
function showStage(i) { go('callbacks', { stage: i }); }
function setSlot(slot, val) {
  const p = { ...V.plan };
  if (slot === 'cls') p.cls = val === '1';
  else if (slot === 'social') { p.social = val === '1'; if (!p.social) p.mock = false; }
  else if (slot === 'mock') p.mock = val === '1';
  else if (slot === 'prac') p.prac = val;
  else if (slot === 'priv') p.priv = val || null;
  V.plan = p; render();
}

app.addEventListener('submit', e => {
  if (e.target.id !== 'startForm') return;
  e.preventDefault();
  const name = (document.getElementById('nm').value || 'Alex').trim().slice(0, 16) || 'Alex';
  const role = document.getElementById('roleFollow').checked ? 'Follow' : 'Lead';
  saved = null; S = E.newGame(name, role); newWeekPlan(); go('pickRival', { tone: 'friendly', label: null, labelOwn: '' });
});
app.addEventListener('input', e => { if (e.target.id === 'rivalLabel') V.labelOwn = e.target.value; });
// Remember which fold-away sections are open. 'toggle' doesn't bubble, so listen in the capture phase.
app.addEventListener('toggle', e => {
  const t = e.target; if (!t.dataset || !t.dataset.sec) return;
  V.open = { ...(V.open || {}), [t.dataset.sec]: t.open };
  if (t.dataset.sec === 'shop' && t.open && S) { S.shopSeen = [...(S.shopSeen || []), ...shopNew()]; t.querySelectorAll('.newtag').forEach(x => x.remove()); }
  save();
}, true);
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.howto === 'close') { V.howto = false; V.introDone = true; try { localStorage.setItem(INTRO_KEY, '1'); } catch (err) {} return render(); }
  if (d.tips) { go('tips'); return; }
  if (d.tipsback) return go('hub');
  if (d.howto === 'open') { V.howto = true; render(); return window.scrollTo(0, 0); }
  if (d.slot === 'hotel') { V.single = d.val === '1'; return render(); }
  if (d.slot === 'tone') { if (V.tone !== d.val) V.label = null; V.tone = d.val; return render(); }
  if (d.slot === 'label') { V.label = d.val; V.labelOwn = ''; return render(); }
  if (d.slot === 'relabel') { E.describeRival(S, V.editLabel, d.val); return render(); }
  if (d.relabelown) { const el = document.getElementById('relabelOwn'); E.describeRival(S, d.relabelown, el && el.value); V.editLabel = null; return render(); }
  if (d.relabelno) { V.editLabel = null; return render(); }
  if (d.editlabel) { V.editLabel = d.editlabel; return render(); }
  if (d.pickmain || d.ownrival) {
    const lab = (V.labelOwn || '').trim() || V.label || E.RIVALRY[V.tone || 'rival'][0];
    if (d.pickmain) E.pickMain(S, d.pickmain, V.tone, lab);
    else { const el = document.getElementById('rivalName'), nm = (el && el.value || '').trim(); if (!nm) return el && el.focus(); E.pickMain(S, { name: nm }, V.tone, lab); }
    V.label = null; V.labelOwn = ''; return go('hub');
  }
  if (d.rivals) return go('rivals', { confirmStop: null, editLabel: null });
  if (d.rivalsback) return go('hub');
  if (d.track) { if (E.trackRival(S, d.track, d.tone)) V.editLabel = d.track; return render(); } // then describe it (v55)
  if (d.decline) { if (S.near && S.near[d.decline]) S.near[d.decline].no = true; S.suggest = null; return render(); }
  if (d.stop) { if (S.rivalry[d.stop] && S.rivalry[d.stop].main) { V.confirmStop = d.stop; return render(); } E.stopRival(S, d.stop); return render(); }
  if (d.stopok) { E.stopRival(S, d.stopok); V.confirmStop = null; return render(); }
  if (d.stopno) { V.confirmStop = null; return render(); }
  if (d.promodone) { S.moved.seen = true; return V.promoBack === 'event' ? afterEvent() : go(V.promoBack === 'eventIntro' ? 'eventIntro' : 'hub'); }
  if (d.slot) return setSlot(d.slot, d.val);
  if (d.buy) { E.buyGear(S, d.buy); return render(); }
  if (d.stand) { E.buyStand(S, d.stand); return render(); }
  if (d.evt) { E.answerEvent(S, d.evt === 'yes'); return render(); }
  if (d.same) { V.plan = E.sanitizePlan(S, S.lastPlan); return render(); }
  if (d.intro && S.pals && S.pals[d.intro]) { S.pals[d.intro].seen = true; save(); return render(); }
  if (d.lock) { if (S.evt && !S.evt.resolved) E.answerEvent(S, false); const chk = E.checkPlan(S, V.plan); if (!chk.ok) return; const r = E.applyWeek(S, V.plan); return go('weekDone', { result: r }); }
  if (d.next) return afterWeek();
  if (d.register) { const ev = E.eventAt(S, S.week); E.startEvent(S, { single: !!V.single && ev.travel !== 'home' }); V.single = false; V.ev = S.wk.res; V.review = null; return go('weekend'); }
  if (d.pick) { E.chooseSlot(S, d.pick); return render(); }
  if (d.round) {
    const x = E.danceRound(S); V.ev = S.wk.res;
    if (x.round === 'Prelims') return showStage(0);
    if (x.round === 'Semifinal') return go('semi');
    return go('draw');
  }
  if (d.wk) return go('weekend');
  if (d.sheets) return go('sheets');
  if (d.sumback) return go('weekendSum');
  if (d.wrap) { E.finishEvent(S); return go('weekendSum'); }
  if (d.skip) { E.skipEvent(S); return afterEvent(); }
  if (d.moveup) { E.moveUp(S); return S.done ? go('end') : go('promo', { promoBack: V.screen }); }
  if (d.cal) { E.setGoing(S, d.cal, d.on === '1'); return render(); }
  if (d.snooze) { V.snooze = { season: seasonNo(), week: nextEventWeek() || E.WEEKS }; return render(); }
  if (d.nextseason) { E.newSeason(S); newWeekPlan(); return go('hub'); }
  if (d.semi) return go('semi');
  if (d.stage) return showStage(Number(d.stage));
  if (d.review) { const rv = E.buyReview(S, V.ev, d.review); if (rv) V.review = rv; return render(); }
  if (d.draw) return go('draw');
  if (d.dance) return go('dance');
  if (d.skipdance) return finishDance(true);
  if (d.scores) return go('results');
  if (d.evdone) return afterEvent();
  if (d.restart) { clearSave(); S = null; return go('start'); }
  if (d.continue) {
    try { loadGame(saved); saved = null; return render(); }
    catch (err) { clearSave(); S = null; V = { screen: 'start' }; return render(); } // a broken save: drop it, start fresh
  }
});

/* ---------- dance floor ---------- */
const DUR = 14;
let danceState = null;
function finishDance(skip) {
  if (!danceState) return;
  const { feed, moments, shown } = danceState;
  if (skip) for (let i = shown.n; i < moments.length; i++) addMoment(feed, moments[i]);
  shown.n = moments.length;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  const c = document.getElementById('count'); if (c) c.textContent = 'Final pose';
  document.getElementById('scoresBtn').hidden = false;
  document.getElementById('skipBtn').hidden = true;
  danceState.done = true;
  if (skip) danceState.draw && danceState.draw(DUR);
}
// Moments land under their song; each new song appears on top, so the one playing stays nearest the floor.
function songGroup(feed, si) {
  const r = V.ev; let grp = document.getElementById('grp' + si);
  if (grp) return grp;
  grp = document.createElement('li'); grp.className = 'grp'; grp.id = 'grp' + si;
  grp.innerHTML = (r.songs ? songCard(r.songs[si], songHead(r, si), r.fit && r.fit[si], true) : '') + '<ul class="feed"></ul>';
  feed.prepend(grp);
  const sl = document.getElementById('songline'); if (sl && r.songs) sl.textContent = songLabel(r, si);
  return grp;
}
function addMoment(feed, m) {
  const r = V.ev; const si = r.songs && m.song !== undefined ? m.song : 0;
  if (r.songs) for (let k = 0; k < si; k++) songGroup(feed, k); // skipping ahead still lists songs in order
  songGroup(feed, si).querySelector('ul').insertAdjacentHTML('beforeend', momentLi(m));
}
function startDance() {
  const r = V.ev; const cv = document.getElementById('floor'); const feed = document.getElementById('feed'); const countEl = document.getElementById('count');
  const css = getComputedStyle(document.documentElement); const col = n => css.getPropertyValue(n).trim();
  const C = { floor: col('--floor'), line: col('--floor-line'), me: col('--accent'), partner: col('--partner'), good: col('--good'), bad: col('--bad'), text: col('--floor-text') };
  const ctx = cv.getContext('2d'); const dpr = Math.min(2, window.devicePixelRatio || 1); let W = 0, H = 0;
  const size = () => { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size(); window.addEventListener('resize', size, { once: true });

  // The set is split evenly across the dance; each song plays at its own tempo.
  const songs = r.songs || [r.song], segLen = DUR / songs.length;
  const songAt = t => Math.min(songs.length - 1, Math.floor(t / segLen));
  const kinds = ['sugar', 'pass', 'whip', 'tuck', 'pass', 'sugar', 'pass', 'whip', 'tuck'];
  const seq = []; let t = 0, side = 1, i = 0;
  while (t < DUR + 2) {
    const beat = 60 / (songs[songAt(t)].bpm * 1.35);
    const p = kinds[(i++ + Math.floor(Math.random() * 3)) % kinds.length]; const counts = p === 'whip' ? 8 : 6;
    seq.push({ p, start: t, dur: counts * beat, counts, side }); if (p === 'pass') side = -side; t += counts * beat;
  }
  const labels6 = ['1', '2', '3 &', '4', '5 &', '6'], labels8 = ['1', '2', '3 &', '4', '5', '6', '7 &', '8'];
  const mTimes = r.moments.map((_, k) => 1.4 + k * 2.1);
  const shown = { n: 0 }; const rings = []; const trails = { f: [], l: [] };
  const meLead = S.role === 'Lead';

  function pose(pt, u) {
    const c = .5, s = pt.side, E1 = .34;
    let fx, fy = 0, lx, ly = 0;
    if (pt.p === 'sugar' || pt.p === 'tuck') {
      const k = Math.sin(Math.PI * u); fx = c + s * (E1 - .22 * k); lx = c - s * .06 + s * .02 * k;
    } else if (pt.p === 'pass') {
      fx = c + s * E1 * Math.cos(Math.PI * u); lx = c - s * .06 * Math.cos(Math.PI * u); ly = -34 * Math.sin(Math.PI * u); fy = 6 * Math.sin(Math.PI * u);
    } else {
      const pcx = c - s * .02, rr = .04;
      if (u < .3) { const q = u / .3; fx = c + s * (E1 - (E1 - .02) * q); lx = c - s * .06; }
      else if (u < .8) { const a = (u - .3) / .5 * Math.PI * 2; fx = pcx + s * rr * Math.cos(a); lx = pcx - s * rr * Math.cos(a); fy = 1; ly = 1; pt._a = a; }
      else { const q = (u - .8) / .2; fx = c + s * (.02 + (E1 - .02) * q); lx = c - s * .06; }
    }
    return { fx, fy, lx, ly };
  }
  function draw(el) {
    const x0 = W * .06, x1 = W * .94, sw = x1 - x0, cy = H * .55, half = 30;
    ctx.fillStyle = C.floor; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.globalAlpha = .35;
    for (let x = 0; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.setLineDash([6, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, cy - half); ctx.lineTo(x1, cy - half); ctx.moveTo(x0, cy + half); ctx.lineTo(x1, cy + half); ctx.stroke(); ctx.setLineDash([]);
    const pt = seq.find(p => el >= p.start && el < p.start + p.dur) || seq[seq.length - 1];
    const u = Math.min(1, (el - pt.start) / pt.dur);
    const ps = pose(pt, u);
    let F = [x0 + ps.fx * sw, cy + ps.fy], L = [x0 + ps.lx * sw, cy + ps.ly];
    if (pt.p === 'whip' && u >= .3 && u < .8) { const a = pt._a, R = .04 * sw; F[1] = cy - Math.sin(a) * R * pt.side; L[1] = cy + Math.sin(a) * R * pt.side; }
    const mx = (F[0] + L[0]) / 2, my = (F[1] + L[1]) / 2;
    const g = ctx.createRadialGradient(mx, my, 4, mx, my, 110); g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 110, 0, Math.PI * 2); ctx.fill();
    if (!reduced) {
      trails.f.push(F); trails.l.push(L); if (trails.f.length > 14) { trails.f.shift(); trails.l.shift(); }
      ['f', 'l'].forEach(k => trails[k].forEach((p, idx) => { ctx.globalAlpha = idx / trails[k].length * .25; ctx.fillStyle = ((k === 'l') === meLead) ? C.me : C.partner; ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, Math.PI * 2); ctx.fill(); }));
      ctx.globalAlpha = 1;
    }
    for (let k = rings.length - 1; k >= 0; k--) {
      const rg = rings[k]; const a = (el - rg.t) / .8; if (a > 1) { rings.splice(k, 1); continue; }
      ctx.strokeStyle = rg.c; ctx.globalAlpha = 1 - a; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(mx, my, 24 + a * 50, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    const dot = (p, fill, label) => {
      ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.text; ctx.font = '700 11px "DM Sans", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, p[0], p[1] - 18);
    };
    const pName = r.partner.name;
    if (meLead) { dot(F, C.partner, pName); dot(L, C.me, 'You'); } else { dot(L, C.partner, pName); dot(F, C.me, 'You'); }
    if (pt.p === 'tuck' && u > .45 && u < .8) { ctx.strokeStyle = meLead ? C.partner : C.me; ctx.lineWidth = 2; const a0 = (u - .45) / .35 * Math.PI * 4; ctx.beginPath(); ctx.arc(F[0], F[1], 16, a0, a0 + 1.6); ctx.stroke(); }
    const bi = Math.min(pt.counts - 1, Math.floor(u * pt.counts));
    if (countEl && el < DUR) countEl.textContent = (pt.counts === 8 ? labels8 : labels6)[bi];
  }
  danceState = { feed, moments: r.moments, shown, done: false, draw };
  const t0 = performance.now();
  const frame = now => {
    const el = (now - t0) / 1000;
    if (r.songs) for (let k = 0; k <= songAt(Math.min(el, DUR - .01)); k++) songGroup(feed, k);
    while (shown.n < r.moments.length && el >= mTimes[shown.n]) {
      const m = r.moments[shown.n]; addMoment(feed, m); rings.push({ t: el, c: m.ok ? C.good : C.bad }); shown.n++;
    }
    draw(Math.min(el, DUR));
    if (el >= DUR) { finishDance(false); return; }
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(data) {
  // A live artifact update hands over the running game directly; otherwise offer the saved one.
  if (validState(data)) loadGame(data);
  else saved = readSave();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S, V }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
