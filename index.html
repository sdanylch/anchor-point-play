<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anchor Point</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column of quiet cards; the dance-floor canvas and the competitor bib are the two bold moments */
:root{
  --bg:#e9ebf2; --surface:#ffffff; --surface-2:#f3f4f9; --ink:#191c35; --muted:#5b6082; --line:#d5d8e6;
  --accent:#d4366a; --accent-soft:#f9dfe8; --on-accent:#ffffff;
  --good:#11806e; --good-soft:#d8f1ec; --bad:#c23f3a; --bad-soft:#f8e0de; --warn:#9a6a10;
  --floor:#231f3d; --floor-line:#3f3968; --floor-text:#cfc9f0; --partner:#f2efe6;
  --paper:#fbfaf5; --paper-ink:#1b1b22;
  --gold:#b98a1f; --silver:#7d869a; --bronze:#a2622f;
  --c-time:#d4366a; --c-tech:#2f6fd6; --c-conn:#11806e; --c-mus:#b98a1f; --c-comp:#7a4fc9;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111327; --surface:#1b1e38; --surface-2:#22264a; --ink:#e7e8f6; --muted:#9ca1c6; --line:#2e3259;
  --accent:#ff5c8d; --accent-soft:#3a1d33; --on-accent:#1a0b12;
  --good:#3cc4a9; --good-soft:#15352f; --bad:#ff7b72; --bad-soft:#3b1d20; --warn:#e6b04d;
  --floor:#0b0a19; --floor-line:#2e2a52; --floor-text:#b3acd9; --partner:#e9e6dc;
  --gold:#e0b44a; --silver:#a9b1c4; --bronze:#d08a52; color-scheme:dark;
  --c-time:#ff5c8d; --c-tech:#6ea8ff; --c-conn:#3cc4a9; --c-mus:#e0b44a; --c-comp:#b48cff;
}}
:root[data-theme="dark"]{
  --bg:#111327; --surface:#1b1e38; --surface-2:#22264a; --ink:#e7e8f6; --muted:#9ca1c6; --line:#2e3259;
  --accent:#ff5c8d; --accent-soft:#3a1d33; --on-accent:#1a0b12;
  --good:#3cc4a9; --good-soft:#15352f; --bad:#ff7b72; --bad-soft:#3b1d20; --warn:#e6b04d;
  --floor:#0b0a19; --floor-line:#2e2a52; --floor-text:#b3acd9; --partner:#e9e6dc;
  --gold:#e0b44a; --silver:#a9b1c4; --bronze:#d08a52; color-scheme:dark;
  --c-time:#ff5c8d; --c-tech:#6ea8ff; --c-conn:#3cc4a9; --c-mus:#e0b44a; --c-comp:#b48cff;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.15;letter-spacing:-.01em}
h2{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.back{background:none;border:0;color:var(--muted);font-weight:700;padding:0;align-self:flex-start}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.02em}
.meters{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:end}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .lbl{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.pay{font-size:.7rem;color:var(--muted);font-weight:500}
.money{font-family:var(--mono);font-weight:700;font-size:1.25rem}
.track{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--ink);transition:width .6s ease}
.fill.energy{background:var(--good)}
.fill.energy.low{background:var(--bad)}
.fill.points{background:var(--accent)}
.meter.mood{grid-column:2/-1}
.fill.mood{background:var(--gold)}
.fill.mood.low{background:var(--bad)}
.fill.mood.smug{background:var(--muted)}
.lbl .smug{color:var(--accent)}

/* dancer card with bib */
.dancer{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.bib{background:var(--paper);color:var(--paper-ink);border-radius:6px;width:96px;padding:8px 6px 6px;text-align:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08),0 6px 14px -8px rgba(0,0,0,.4);transform:rotate(-2deg)}
.bib::before,.bib::after{content:"";position:absolute;top:5px;width:6px;height:6px;border-radius:50%;background:#9aa0b3;box-shadow:0 0 0 1.5px #d9dbe3}
.bib::before{left:6px}.bib::after{right:6px}
.bib .ev{font-size:.55rem;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.bib .n{font-family:var(--mono);font-weight:700;font-size:1.9rem;line-height:1.1}
.bib .div{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid #1b1b2233;padding-top:3px;margin-top:2px}
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .name{font-weight:700;font-size:1.1rem}
.stat{display:grid;grid-template-columns:92px 1fr minmax(30px,auto);gap:8px;align-items:center}
.stat .sl{font-size:.82rem;font-weight:500}
.stat .sv{font-family:var(--mono);font-weight:700;text-align:right;font-size:.85rem}
.stat .rd{grid-column:2/-1;font-size:.72rem;color:var(--muted);margin-top:-5px}
.stat .feel{font-family:inherit;font-size:1rem;color:var(--good)}
.stat .feel.flat{color:var(--muted)}
.read{font-size:.86rem;font-weight:600;margin-top:4px}
.stat .fill{background:var(--ink)}
.track.split{display:flex}
.stat .fill.item{background:var(--gold);border-radius:0 99px 99px 0}
.swatch{display:inline-block;width:10px;height:8px;border-radius:2px;background:var(--gold);margin-right:4px;vertical-align:middle}
.sv .plus{color:var(--gold);font-size:.72rem}
.cash{font-family:var(--mono);color:var(--accent)}
.rtag{font-size:.62rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:0 5px;margin-left:4px;vertical-align:middle}
.rtag.friendly{color:var(--good);border-color:var(--good)}
.rtag.nem{color:var(--bad);border-color:var(--bad)}
.rivalin{width:100%;margin:6px 0 10px}
table.sheet td,table.sheet th{padding:5px 5px;font-size:.78rem}
td.mk-yes{color:var(--good);font-weight:700}
td.mk-alt{color:var(--warn)}
tr.cutline td{border-top:2px solid var(--accent)}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"▸";color:var(--muted);font-weight:700;margin-left:auto}
details.fold[open]>summary::after{content:"▾"}
.people{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.people li{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:.88rem;align-items:baseline}
.howto ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.cash.ok{color:var(--good)}
.cash.short{color:var(--bad)}
.delta{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--good);margin-left:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wk{height:30px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.wk.past{background:var(--line)}
.wk.now{border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:0 0 0 1px var(--accent)}
.wk.ev{background:var(--accent-soft);color:var(--accent);font-weight:700}
.wk.ev.past{background:var(--line);color:var(--muted)}
.wk.ev.off{background:var(--surface-2);color:var(--muted);border-style:dashed;font-weight:500}
.calrows li.off b{color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}

/* action cards */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.act:hover:not([disabled]){border-color:var(--accent)}
.act .t{font-weight:700;font-size:.98rem}
.act .d{font-size:.8rem;color:var(--muted);flex:1}
.act .c{font-family:var(--mono);font-size:.74rem;font-weight:700}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act .why{font-size:.74rem;color:var(--bad);font-weight:700}

/* pick lists */
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .t{font-weight:700}
.opt .lv{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.opt .d{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.opt .c{font-family:var(--mono);font-size:.78rem;font-weight:700;align-self:start}

.diary ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.diary li{font-size:.86rem;color:var(--muted);display:grid;grid-template-columns:44px 1fr;gap:6px}
.diary li b{font-family:var(--mono);color:var(--ink);font-size:.74rem}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.76rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.warn{font-size:.85rem;color:var(--warn);font-weight:700}

/* start */
.logo{font-size:clamp(2.6rem,13vw,3.8rem);line-height:.95;letter-spacing:-.03em}
.logo span{color:var(--accent)}
.start{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.lede{font-size:1.02rem;max-width:44ch}
form{display:flex;flex-direction:column;gap:10px}
label.f{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text]{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:center;font-weight:700;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.9rem}

/* draw cards */
.draws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flip{perspective:800px}
.flip .inner{position:relative;transform-style:preserve-3d;animation:flipin .7s ease both}
.flip:nth-child(2) .inner{animation-delay:.45s}
@keyframes flipin{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.drawcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;backface-visibility:hidden;min-height:170px}
.drawcard .big{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.2}
.wbar{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:.72rem;color:var(--muted)}
.wbar .track{height:6px}
.wbar .fill{background:var(--accent)}

/* dance */
.floorwrap{background:var(--floor);border-radius:var(--r);overflow:hidden;position:relative}
canvas#floor{display:block;width:100%;height:230px}
.count{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-weight:700;color:var(--floor-text);font-size:1.1rem}
.songline{position:absolute;left:12px;top:10px;font-size:.74rem;color:var(--floor-text);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.feed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem;animation:pop .35s ease both}
@keyframes pop{from{transform:translateY(-6px);opacity:.3}to{transform:none;opacity:1}}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--mono)}
.mk.good{background:var(--good-soft);color:var(--good)}
.mk.bad{background:var(--bad-soft);color:var(--bad)}
.feed .tag{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
/* songs revealed one at a time, each with its own moments */
.feed li.grp{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;animation:none}
.songcard{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:2px;animation:pop .35s ease both}
.songcard p{margin:0}
.songcard .sh{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fit{font-weight:700}
.fit.good{color:var(--good)}
.fit.bad{color:var(--bad)}
.setlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.setlist p{margin:0}
.vs{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:.8rem}
.vs .bar{position:relative;height:8px;background:var(--surface-2);border-radius:99px}
.vs .bar::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.vs .bar i{position:absolute;top:0;bottom:0;border-radius:99px}
.vs .bar i.up{left:50%;background:var(--good)}
.vs .bar i.down{right:50%;background:var(--bad)}
.vs .num{text-align:right;font-weight:700}
.vs .num.good{color:var(--good)}
.vs .num.bad{color:var(--bad)}
.mystery{display:flex;gap:8px;align-items:center;font-size:.86rem}
.mystery .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--mono);font-size:.74rem;font-weight:700}

/* season recap */
.chart svg{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .evl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--mono)}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.84rem;margin-top:10px}
.legend .sw{width:14px;height:4px;border-radius:2px}
.legend .num{text-align:right}

/* results */
.placing{display:flex;gap:14px;align-items:center}
.place{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--accent)}
.place.p1{color:var(--gold)}.place.p2{color:var(--silver)}.place.p3{color:var(--bronze)}
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
td.cp,th.cp{text-align:left;white-space:normal;min-width:110px}
td.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.r.cnt{font-weight:700}
tr.me td{background:var(--accent-soft)}
tr.pr td{background:var(--good-soft)}
tr.pr td.cp{color:var(--good);font-weight:700}
td.pl{font-family:var(--mono);font-weight:700}
.jf{font-size:.6rem;letter-spacing:0;text-transform:none;font-weight:500}
td.r.dim{color:var(--muted)}
td.maj{font-family:var(--mono);font-size:.76rem;white-space:nowrap}
.why{font-size:.86rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.timeline{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-family:var(--mono);font-size:.74rem;font-weight:700;color:var(--muted);padding-top:2px}
.timeline .wb{display:flex;flex-direction:column;gap:6px;min-width:0}
.timeline li.round .when{color:var(--accent)}
.timeline li.now .when{color:var(--ink)}
.timeline li.now{background:linear-gradient(90deg,var(--accent-soft),transparent 60%);margin-inline:-14px;padding-inline:14px}
.timeline li.next{opacity:.8}
.chip.warn-chip{background:var(--surface-2);color:var(--warn);border-color:var(--warn)}
.banner.evt{border-color:var(--warn)}
.shop{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.shop li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.shop li>div{min-width:0}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes li{font-size:.88rem;display:grid;grid-template-columns:10px 1fr;gap:8px}
.notes li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.notes li.good::before{background:var(--good)}
.notes li.bad::before{background:var(--bad)}

/* callback sheet */
.bibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.bibs span{font-family:var(--mono);font-weight:700;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:5px;padding:7px 0;text-align:center;animation:pop .3s ease both;animation-delay:calc(var(--i) * 110ms)}
.bibs span.me{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.verdict{animation:pop .4s ease both;animation-delay:calc(var(--n) * 110ms + 350ms)}
@media (prefers-reduced-motion: reduce){ .bibs span,.verdict{animation:none} }

@media (prefers-reduced-motion: reduce){
  .flip .inner,.feed li,.songcard{animation:none}
  .fill{transition:none}
}

/* v3: planner, news, community */
.cal{grid-template-columns:repeat(9,1fr)}
.news{display:flex;flex-direction:column;gap:8px}
.banner{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:0;font-size:.86rem}
.linkbtn[disabled]{color:var(--muted);opacity:.6;cursor:not-allowed}
.slot{display:grid;grid-template-columns:40px 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.slot .day{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--muted);padding-top:2px}
.sb{display:flex;flex-direction:column;gap:6px;min-width:0}
.st{font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

    { text: 'Someone switched your phone\u2019s language to Finnish. Your alarm went off, and you couldn\u2019t work out how to stop it.' },
    { text: 'Your suitcase was zip-tied shut. Twelve zip ties. Good luck getting that open!' },
    { text: 'You came back to a floor covered in paper cups of water, wall to wall. It took twenty minutes to reach your bed.', energy: 3 },
    { text: 'Your bib was swapped for a hand-drawn one that says \u201c#1 DIVA\u201d. Your real one was found hidden underneath.' },
  ];
  const SOCIAL_FLAVOR = ['Eleven songs at the Friday social. Your feet hurt in a good way.',
    'A midnight blues set taught you more about connection than any class.',
    'The DJ played three songs you had never heard. You survived all of them.'];

  const usedBibs = new Set();
  function bib() { let b; do { b = randi(101, 499); } while (usedBibs.has(b)); usedBibs.add(b); return b; }
  function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

  function newGame(name, role) {
    usedBibs.clear();
    const s = { name, role, bib: null, clsTopic: rollClass(), met: {}, week: 1, money: 350, energy: 90,
      stats: { time: 24, tech: 30, conn: 28, mus: 26, comp: 22 }, sc: 10, points: 0, winnings: 0, chem: 0, discount: false,
      lenaInTown: false, pals: {}, gear: {}, devUnlocked: false, devNewsWeek: 0, heatDone: false, lastPlan: null,
      log: [], history: [], done: false, promoted: false, season: 1, div: 'Novice', pts: {}, cal: makeCalendar(SUGGESTED), passes: 0 };
    s.scene = makePop(s, 'scene'); s.field = makePop(s, 'field'); s.popWeek = absWeek(s);
    s.rivalry = {}; makeCandidates(s); pickMain(s, s.cands[0], 'rival'); // the start screen lets you pick another
    s.priya = { div: 'Novice', pts: PRIYA.pts, skill: PRIYA.skill, rate: PRIYA.rate };
    s.statLog = [{ season: 1, week: 0, stats: { ...s.stats } }]; // one snapshot per week, for the end-of-season chart

  }
  // After loading a saved season: remember which bibs are already taken this weekend,
  // so a final partner never gets the same number as a rival.
  function resume(s) {
    if (!s.field) { // saves from before the living divisions: give everyone a place on the circuit
      const t = shuffle(popTemplate().filter(x => x.div === 'Novice'));
      (s.scene || []).forEach((d, i) => Object.assign(d, { div: 'Novice', skill: t[i % t.length].skill, rate: t[i % t.length].rate, out: t[i % t.length].out }));
      s.ids = { scene: (s.scene || []).length, field: 0 }; s.field = makePop(s, 'field');
      (s.rivals || []).forEach((r, i) => s.field.push({ ...newDancer('r' + i, r.name, 'Novice', 40), strong: r.strong, off: r.off, rival: true }));
      delete s.rivals;
    }
    if (!s.rivalry) { // saves from before v37: your three rivals become tracked rivals, the first your main one
      s.rivalry = {};
      (s.field || []).filter(d => d.rival).forEach((d, i) => { d.type = i ? 'mirror' : 'main'; s.rivalry[d.id] = { name: d.name, main: !i, tone: 'rival', type: d.type, since: { season: 1, week: 1, div: 'Novice' }, w: 0, l: 0, meets: [], former: null }; });
      if (s.moved) s.moved.seen = true;
    }
    if (!s.priya) s.priya = { div: 'Intermediate', pts: 0, skill: 75, rate: PRIYA.rate };
    if (!s.cal) s.cal = makeCalendar(SUGGESTED); // saves from before the calendar
    s.cal.forEach(c => { if (c.locked === undefined && bookBy(c) < s.week) { c.locked = true; if (c.going) c.legacy = true; } }); // saves from before booking
    const fixNotes = res => { if (!res || !Array.isArray(res.notes) || !res.notes.some(n => typeof n === 'string')) return; res.rivalMiles = res.notes.filter(n => typeof n === 'string').map(text => ({ text })); res.notes = res.notes.filter(n => typeof n !== 'string'); };
    if (s.wk) fixNotes(s.wk.res);
    usedBibs.clear(); if (s.bib) usedBibs.add(s.bib);
    if (s.wk) [...s.wk.res.rivals, ...(s.wk.res.partners || []), ...(s.wk.res.others || [])].forEach(r => usedBibs.add(r.bib));
  }

  // Every training source teaches at a level: the stat where it teaches you half as much as it would a beginner.
  // Gains shrink by 1/span for every point you gain, between full value and `floor` (you always pick something up).
  // A level-60 source is exactly the old Novice rule (1 − stat/120). Group classes and event workshops run a
  // track for your division, so moving up gives you more to learn; partners, coaches and pros have their own level.
  const LENA_MULT = .6; // Leah's base gains (her level does the rest; trimmed in v42 when her level went 80 → 160)
  const DEV_BASE = .6; // Dev's base gains (v42: his level went 80 → 130, which made the first Intermediate season too easy)
  const LV = {
    span: 120, floor: .1,
    cls: { Novice: 60, Intermediate: 95 }, workshop: { Novice: 60, Intermediate: 95 },
    star: { Novice: 60, Intermediate: 100 }, starRare: { Novice: 85, Intermediate: 125 },
    solo: 60, social: 60, mock: 60, priya: 60, dev: 130, lena: 160, eventSocial: 80, // Dev is Advanced, Leah an All-Star (v42)
    private: 120, popup: 140, pro: 140,
  };
  // Some things grow with you (Steve: they always teach you something): you drill harder things as you improve,
  // and at socials you dance with better people. Their level never drops below your stat + the edge, so they settle
  // at a steady value once you pass their base level (solo ~2/3, socials 1/2: "teaches you some").
  const GROWS = { solo: 20, social: 0, eventSocial: 0 };
  const levelOf = (s, src, st) => {
    if (src === 'priya' && s.priya) return s.priya.skill;
    if (GROWS[src] !== undefined && st) return Math.max(LV[src], s.stats[st] + GROWS[src]);
    const v = LV[src]; return typeof v === 'number' ? v : v[s.div || 'Novice'];
  };
  const teach = (stat, level) => Math.max(LV.floor, Math.min(1, .5 - (stat - level) / LV.span));
  // How much a source still teaches you, averaged over the stats it trains (1 = everything, LV.floor = little).
  // "+3 to +5" scaled by how much a source still teaches you in that stat, for option text.
  function gainRange(s, src, st, lo, hi) {
    const f = teach(s.stats[st], levelOf(s, src, st));
    return hi * f < 1 ? 'little left to teach you' : gainWord((lo + hi) / 2 * f);
  }
  // Hidden stats (Steve, v49): you never see your numbers, not even as bands. You feel your progress (`feel`), and a
  // coach or a pro tells you where one skill stands in your division (`readStat`). Each level has two names, one of
  // them picked 50/50 every time (Steve's mix of coach talk and "where it gets you").
  const gainWord = v => v < 1 ? 'a touch' : v < 2.5 ? 'a little' : v < 5 ? 'a step up' : v < 8 ? 'a big step up' : 'a leap';
  const LEVEL_WORDS = [['Needs work', 'Rough'], ['Getting there', 'Decent'], ['Solid', 'Smooth'], ['That\u2019s a strength', 'Chef\u2019s kiss']]; // coach talk / social-floor talk (Steve, v49)
  const LEVEL_AT = [.65, .88, .97]; // share of your division below you (v53, Steve: .55/.78/.93 read "Chef's kiss" too easily)
  function levelIn(s, k) {
    const div = s.div || 'Novice', pool = (s.field || []).filter(d => d.div === div);
    if (!pool.length) return 1;
    const below = pool.filter(d => dancerStats(d)[k] < s.stats[k]).length / pool.length;
    return LEVEL_AT.filter(x => below >= x).length;
  }
  function readStat(s, k, who) {
    const lvl = levelIn(s, k), word = pick(LEVEL_WORDS[lvl]);
    s.reads = s.reads || {};
    s.reads[k] = { season: s.season || 1, week: s.week, div: s.div || 'Novice', lvl, word, who };
    return `${who} on your ${LABEL[k]}: \u201c${word}\u201d (for ${s.div || 'Novice'}).`;
  }
  // How a skill has felt over the last four weeks, from your weekly log (your stats never go down).
  function feel(s, k) {
    const now = absWeek(s), log = s.statLog || [];
    let then = null;
    for (const p of log) if (((p.season || 1) - 1) * WEEKS + p.week <= now - 4) then = p;
    if (!then) then = log[0];
    const d = then ? s.stats[k] - then.stats[k] : 0;
    return d >= 9 ? { arrow: '\u2191\u2191', word: 'big strides' } : d >= 4 ? { arrow: '\u2191', word: 'feels better' } : d >= 1.5 ? { arrow: '\u2197', word: 'a little better' } : { arrow: '\u2192', word: 'about the same' };
  }
  const teachFrac = (s, src, stats) => stats.reduce((a, k) => a + teach(s.stats[k], levelOf(s, src, k)), 0) / stats.length;

  // The one rule for stat gains. `src` is a training source in LV (its level decides how much it still teaches you),
  // or true for things that always land in full (video reviews, small one-offs). The coach's focus stat gets +50%
  // while it lasts. Fractions round fairly (0.3 lands as +1 three times in ten), so a source that has little left
  // to teach you really does give little. Adds what was actually gained to `into` (if given) and returns it.
  // Motivation (Steve, v51): your mind over the season, beside energy (this week's body). Doing the same week again
  // wears it down; socials, new people, near misses, wins and room pranks lift it. It scales training gains by up to
  // ±15% (`effect`), and when it's low you sometimes skip class. Shown as a word and a bar, never a number.
  // Every week it drifts `pull` of the way back to `rest` (highs and lows fade), so a week of socials alone settles
  // around Keen. Gains are ×1 at `mid` (a sensible, varied player's usual level), up to +15% at max, −15% at min.
  const MOOD = { start: 70, min: 40, max: 100, mid: 76, rest: 68, pull: .2, effect: .15, same: 5, rut: 10, rutAt: 3, money: 3, social: 2, mock: 1,
    leah: 2, restLow: 2, newPal: 4, skipBelow: 50, skipChance: .2, firedUp: 85, season: 75,
    smug: .15, smugWeeks: 2, near: 1, win: 8, asHoped: 3, nearMiss: 6, flop: 10, h2hWin: 2, h2hLoss: 2, evSocial: 1, prank: 5, pranked: 3, prankChance: .25 };
  const MOOD_WORDS = [[85, 'Fired up'], [70, 'Keen'], [55, 'Going through the motions'], [0, 'Burnt out']];
  const moodOf = s => s.mood === undefined ? MOOD.start : s.mood;
  // Complacency (v53, Steve): two wins in a row and training lands 15% less for 2 weeks, until anything but a win.
  const isSmug = s => !!(s.complacent && absWeek(s) <= s.complacent.until);
  const moodWord = s => MOOD_WORDS.find(([at]) => moodOf(s) >= at)[1];
  const moodMult = s => { const m = moodOf(s); return 1 + MOOD.effect * (m - MOOD.mid) / (m >= MOOD.mid ? MOOD.max - MOOD.mid : MOOD.mid - MOOD.min); };
  function moodShift(s, n, why, log) {
    const before = moodOf(s); s.mood = clamp(before + n, MOOD.min, MOOD.max);
    const got = s.mood - before; if (got && log) log.push({ n: got, why }); return got;
  }
  // What counts as "the same week": class, practice (any partner counts as partner practice), a private (any topic)
  // and the social.
  const planKey = p => [!!p.cls, ['rest', 'solo'].includes(p.prac) ? p.prac : 'partner', !!p.priv, !!p.social].join('|');
  // How different two weeks are (v53): each part that changed counts 1, a different practice partner counts ½.
  function planDiff(a, b) {
    const ka = planKey(a).split('|'), kb = planKey(b).split('|');

  }
  function gain(s, st, base, src, into) {
    const f = src === true ? 1 : teach(s.stats[st], levelOf(s, src, st));
    const fm = s.focus && s.focus.stat === st && s.week <= s.focus.until ? 1.5 : 1;
    const mm = src === true ? 1 : moodMult(s) * (isSmug(s) ? 1 - MOOD.smug : 1); // motivation (and complacency) scale training
    const x = base * f * fm * mm, whole = Math.floor(x);

    const got = s.stats[st] - before;
    if (into && got) into[st] = (into[st] || 0) + got;
    return got;
  }

  /* ---------- weekly planner ---------- */
  const emptyPlan = () => ({ cls: false, prac: 'solo', priv: null, social: false, mock: false });
  // Your community runs a mock J&J night the week before the season's three biggest events (Steve: not before every
  // event). It's practice for the whole scene, so it runs whether or not you're going.
  const MOCK_BEFORE = ['sunset', 'rainforest', 'pacific'];
  const mockFor = s => calendarOf(s).find(e => e.week === s.week + 1 && MOCK_BEFORE.includes(e.id)) || null;
  const mockAvailable = s => !!mockFor(s) && socialAvailable(s);
  const socialAvailable = s => !eventAt(s, s.week);
  const privatePrice = s => (s.packs > 0 ? 0 : PRIVATE_COST - (s.discount ? DISCOUNT : 0)); // a lesson pack is prepaid
  const devMult = s => .6 + s.sc / 100;
  const lenaChance = (s, socialed) => Math.min(.65, .22 + s.sc / 300 + (socialed ? .08 : 0));
  const proChance = s => .1 + s.sc / 400;

  function planCost(s, p) {
    let money = 0, energy = 0;
    if (p.cls) { money += CLASS.cost; energy += CLASS.energy; }
    if (p.prac !== 'none') { money += PRACTICE[p.prac].cost; energy += PRACTICE[p.prac].energy; }
    if (p.priv) { money += privatePrice(s); energy += PRIVATE_ENERGY; }
    if (p.social && socialAvailable(s)) { money += SOCIAL.cost; energy += SOCIAL.energy; }
    if (p.social && socialAvailable(s) && p.mock && mockAvailable(s)) { money += MOCK.cost; energy += MOCK.energy; }
    return { money, energy };
  }
  function scGainOf(s, p) { return (p.cls ? SC.cls : 0) + (p.social && socialAvailable(s) ? SC.social : 0) + (p.social && p.mock && mockAvailable(s) ? SC.mock : 0); }
  function checkPlan(s, p) {
    const cost = planCost(s, p);
    if (p.prac === 'priya' && !knows(s, 'priya')) return { ok: false, why: 'You don\u2019t have a practice partner yet', cost };
    if (p.prac === 'lena' && !s.lenaInTown) return { ok: false, why: named(s, '{lena} didn\u2019t ask this week'), cost };
    if (p.prac === 'dev' && !s.devUnlocked) return { ok: false, why: named(s, '{dev} practices with Intermediates and up'), cost };
    if (p.prac === 'priya' && s.evt && s.evt.id === 'priyaSick') return { ok: false, why: named(s, '{priya} is sick this week'), cost };
    if (cost.money > s.money) return { ok: false, why: 'Not enough money', cost };
    if (cost.money > spare(s)) return { ok: false, why: `${holdWhy(s)}: you can spend $${spare(s)}`, cost };
    if (s.energy - cost.energy < 0) return { ok: false, why: 'Not enough energy', cost };
    return { ok: true, cost };
  }
  function sanitizePlan(s, p) {
    const q = { ...emptyPlan(), ...p };
    if (!PRACTICE[q.prac]) q.prac = 'solo';
    if (q.prac === 'priya' && !knows(s, 'priya')) q.prac = 'solo';
    if (q.prac === 'lena' && !s.lenaInTown) q.prac = 'solo';
    if (q.prac === 'dev' && !s.devUnlocked) q.prac = 'solo';
    if (q.prac === 'priya' && s.evt && s.evt.id === 'priyaSick') q.prac = 'solo';
    if (!socialAvailable(s)) q.social = false;
    if (!mockAvailable(s) || !q.social) q.mock = false;

  }

  function applyWeek(s, p) {
    const planned = p, moods = [];
    s.mood = moodOf(s) + (MOOD.rest - moodOf(s)) * MOOD.pull; // highs and lows fade
    // Event weeks (a taper) don't count either way (v53): the routine around them still wears on you.
    const evWeek = !!eventAt(s, s.week), prev = s.routine, diff = prev ? planDiff(prev, p) : 9;
    if (!evWeek) { s.moodRun = diff <= .5 ? (s.moodRun || 1) + 1 : 1; s.routine = { ...p }; } // a new practice partner alone doesn't break the routine
    const skipped = p.cls && moodOf(s) < MOOD.skipBelow && rnd() < MOOD.skipChance; // low motivation: you don't go
    if (skipped) p = { ...p, cls: false };
    const cost = planCost(s, p);
    s.money -= cost.money;
    s.energy = Math.min(100, s.energy - cost.energy);
    const total = {}; const items = [];
    const add = (d, st, base, raw) => { const got = gain(s, st, base, raw, d); total[st] = (total[st] || 0) + got; };
    if (skipped) items.push({ day: 'Tue', title: 'Skipped class', d: {}, note: 'You just weren\u2019t feeling it. You stayed home and scrolled dance videos instead.', tone: 'meh' });
    if (p.cls) {
      const ct = s.clsTopic || rollClass(); const topic = ct.stat; const q = rnd();
      const qual = q < .15 ? 'dud' : q < .8 ? 'solid' : 'great';
      const d = {}; add(d, topic, qual === 'dud' ? 1 : qual === 'solid' ? rand(2.5, 4) : rand(4.5, 6), 'cls');
      if (rnd() < .75) add(d, 'conn', 1, 'cls'); // partners rotate every few minutes; usually something clicks
      items.push({ day: 'Tue', title: 'Group class: ' + ct.name, d, note: qual === 'dud' ? 'Mostly review. You still showed up.' : qual === 'great' ? 'One of those classes that rewires your dancing.' : 'A solid class.', tone: qual === 'dud' ? 'meh' : 'good' });
    }
    if (p.prac === 'rest') items.push({ day: 'Wed', title: 'Rest night', d: {}, note: 'Feet up, finals footage on. +10 energy.', tone: 'meh' });
    if (p.prac !== 'rest') {
      const d = {}; let note;
      if (p.prac === 'solo') { add(d, 'time', rand(1.5, 3) * (s.gear.earbuds ? 1.5 : 1), 'solo'); note = s.gear.earbuds ? 'Triples to the metronome in your earbuds, on the bus and in the kitchen.' : 'Twenty minutes of triples to a metronome in the kitchen.'; }
      else if (p.prac === 'priya') {
        s.chem = Math.min(3, s.chem + 1);
        add(d, 'tech', rand(3, 5) + s.chem * .7, 'priya'); add(d, 'conn', rand(3, 5) + s.chem * .7, 'priya'); add(d, 'time', rand(1, 2), 'priya');
        note = named(s, s.chem >= 3 ? 'You and {priya} finish each other’s patterns now.' : 'You and {priya} are starting to click. Chemistry ' + s.chem + '/3.');
      } else if (p.prac === 'lena') {
        // An All-Star teaches far above you, so her gains keep coming long after a class stops teaching you much.
        const m = LENA_MULT; add(d, 'time', rand(2.5, 4) * m, 'lena'); add(d, 'tech', rand(3.5, 5.5) * m, 'lena'); add(d, 'conn', rand(3.5, 5.5) * m, 'lena'); add(d, 'mus', rand(2.5, 4.5) * m, 'lena'); add(d, 'comp', rand(1, 2.5) * m, 'lena');
        note = named(s, 'Dancing with {lena} showed you what the next level feels like.');
      } else {
        const m = devMult(s) * DEV_BASE; add(d, 'mus', rand(4, 6) * m, 'dev'); add(d, 'time', rand(2, 3.5) * m, 'dev'); add(d, 'conn', rand(1, 2) * m, 'dev');
        note = named(s, m >= 1.1 ? '{dev} has you playing with every accent now. {dev:They} is invested.' : '{dev} walks you through the song structure before every run.');
      }
      items.push({ day: 'Wed', title: named(s, PRACTICE[p.prac].long), d, note, tone: 'good' });
    }
    if (p.priv) {
      const d = {}; add(d, p.priv, rand(7, 10), 'private'); add(d, 'comp', 1, 'private');
      const fromPack = s.packs > 0; if (fromPack) s.packs--;
      const used = !fromPack && s.discount; if (used) s.discount = false;
      items.push({ day: 'Thu', title: 'Private lesson: ' + LABEL[p.priv], d, note: (fromPack ? `From your lesson pack (${s.packs} left). ` : used ? 'Used your $40 discount. ' : '') + 'Your coach teaches well above your level, so privates keep paying off as you improve.', read: readStat(s, p.priv, 'Your coach'), tone: 'good' });
    }
    if (p.social && socialAvailable(s)) {
      const d = {}; add(d, 'conn', rand(1, 2.5), 'social'); add(d, 'mus', rand(1.5, 3), 'social'); add(d, 'time', rand(.5, 1.5), 'social'); add(d, 'comp', rand(.5, 1.5), 'social');
      let note = pick(SOCIAL_FLAVOR);
      if (rnd() < proChance(s)) {
        if (s.discount) { const k = pick(STATS); add(d, k, 3, true); note = 'A pro danced with you again and gave you a tip on the spot.'; }
        else { s.discount = true; note = 'A pro asked you to dance and liked what they saw. $40 off your next private.'; }
      }
      if (s.evt && s.evt.id === 'blues') { add(d, 'mus', 2, true); note = 'All-blues night. You found every pause in every song.'; }
      if (s.evt && s.evt.id === 'birthday') { add(d, 'comp', 2, true); s.sc = Math.min(100, s.sc + 3); note = 'Birthday jam: a new partner every eight counts while the whole room watched.'; }
      items.push({ day: 'Fri', title: 'Friday social', d, note, tone: 'good' });
      if (p.mock && mockAvailable(s)) {
        const d2 = {}; add(d2, 'comp', rand(3, 4.5), 'mock'); add(d2, 'conn', rand(1, 2), 'mock');

      }
    }
    const scg = scGainOf(s, p) + (scGainOf(s, p) && moodOf(s) >= MOOD.firedUp ? 2 : 0); // fired up: you light up the room
    s.sc = Math.min(100, s.sc + scg);
    if (!evWeek && diff === 0) moodShift(s, -(MOOD.same + (s.moodRun >= MOOD.rutAt ? MOOD.rut : 0)), s.moodRun >= MOOD.rutAt ? `the same week, ${s.moodRun} in a row` : 'the same week as last week', moods);
    else if (!evWeek && diff <= 1) moodShift(s, -MOOD.near - (diff <= .5 && s.moodRun >= MOOD.rutAt ? MOOD.same : 0), diff <= .5 && s.moodRun >= MOOD.rutAt ? `the same routine, ${s.moodRun} weeks running` : 'nearly the same week again', moods);
    if (p.social && socialAvailable(s)) moodShift(s, MOOD.social + (p.mock && mockAvailable(s) ? MOOD.mock : 0), 'the Friday social', moods);
    if (p.prac === 'lena') moodShift(s, MOOD.leah, named(s, 'practice with {lena}'), moods);
    if (p.prac === 'rest' && moodOf(s) < 60) moodShift(s, MOOD.restLow, 'a night off', moods);
    if (spare(s) < 40) moodShift(s, -MOOD.money, 'money is tight', moods);

    const rm = rivalMoment(s, p); if (rm) items.push(rm);
    if (!items.length) items.push({ day: '', title: 'A quiet week', d: {}, note: 'Nothing booked. Your body thanks you.', tone: 'meh' });
    s.lastPlan = { ...planned };
    const names = items.filter(i => i.tone !== 'news').map(i => i.title.split(':')[0]).join(', ');
    s.log.unshift({ week: s.week, text: names });
    return { items, deltas: total, sc: scg, money: cost.money, energy: cost.energy, moods };
  }

  // Studios post next week's class topic, so you can decide whether it's the class you need.
  function rollClass() { const stat = pick(STATS); return { stat, name: pick(CLASS_TOPICS[stat]) }; }
  function endWeek(s, seasonBreak) {

    } else if (ev.travel === 'home') {
      news.push({ tag: 'Home', text: 'A local event: you sleep in your own bed, and nobody snores.' });
    } else if (!opts.single && (roomie = activeRivals(s).find(d => s.rivalry[d.id].tone === 'friendly' && (d.div === ev.div ? rv.includes(d) : attends(s, ev, d)))) && rnd() < .5) {
      s.energy = Math.min(100, s.energy + 5); res.roomie = roomie.name;
      news.push({ tag: 'Hotel', text: `You're rooming with ${roomie.name}. Nobody snores, and you talked through the prelims over breakfast (+5 energy).` });
    } else if (!opts.single && rnd() < .25) {
      slots[0].snore = true;
      news.push({ tag: 'Hotel', text: 'Your roommate snores like a leaf blower. Friday night will cost you 10 extra energy, whatever you do.' });
    }
    if (carpool) news.push({ tag: 'Travel', text: 'You carpooled: $40 cheaper, but six hours in the back seat. −8 energy.' });
    if (opts.single) { s.money -= STORE_WK.single.price; s.energy = Math.min(100, s.energy + 10); news.push({ tag: 'Hotel', text: 'Single room: you slept properly (+10 energy), and naps here start at +20 instead of +15.' }); }
    // How you felt you'd do: your place among this field by skill (you can't see it, but you sense it).
    res.expect = 1 + rivals.filter(x => weighted(x.stats, PRELIM_W) > weighted(s.stats, PRELIM_W)).length;
    const wkMoods = [], shared = !opts.single && ev.travel !== 'home';
    if (shared && rnd() < MOOD.prankChance) { // someone from your community got you
      const pr = pick(PRANKED); if (pr.energy) s.energy = Math.max(0, s.energy - pr.energy);
      moodShift(s, MOOD.pranked, 'getting pranked', wkMoods);
      news.push({ tag: 'Pranked', text: pr.text + (pr.energy ? ` −${pr.energy} energy, but you can't stop laughing.` : ' You can\u2019t stop laughing.') });
    }
    s.wk = { res, slots, cur, pro, news, privUsed: false, single: !!opts.single, shared, pranked: false, moods: wkMoods, snacks: 0, crash: false, start: { stats: { ...s.stats }, sc: s.sc, energy: s.energy, money: s.money }, finished: false };
    return s.wk;
  }

  // You can only nap so much: each daytime rest this weekend gives less (full, half, then a quarter).
  const napsBefore = (wk, i) => wk.slots.slice(0, i).filter(x => x.choice === 'rest' && !x.night).length; // a night's sleep isn't a nap
  const NAP = [1, .5, .25];
  function slotOptions(s, i) {
    const wk = s.wk, sl = wk.slots[i], P = wk.pro; const o = [];
    const opt = (id, title, desc, money, energy) => {
      const why = money > s.money ? 'Not enough money' : money > spare(s) ? holdWhy(s) : s.energy - energy < 0 ? 'Not enough energy' : null;
      o.push({ id, title, desc, money, energy, ok: !why, why });
    };
    const fri = sl.t === 'Fri night'; // arrival night: you only just got in, so it's a shorter night
    const sun = sl.t === 'Sun night'; // the last dance of the weekend: spend whatever energy you saved
    if (sl.night) opt('social', fri ? 'Arrival night social' : sun ? 'Sunday night social' : 'Late-night social',
      sun ? 'The last dance of the weekend, and often the best. Connection, musicality, timing, community +6, and faces you\u2019ll see at the next event.'
        : 'The die-hards stay late, so this is the best social dancing of the weekend. Connection, musicality, timing, community +6. Anyone you dance with could be your partner in a final.',
      0, fri ? WK.arrival.energy : WK.social.energy);
    // Pranks happen by day, while everyone's at the workshops (Steve, v55): nights are for the social or sleep.
    if (!sl.night && wk.shared && !wk.pranked) opt('prank', 'Prank another room', 'While everyone\u2019s at the workshops, team up with your roommates and another room from your community. A lot of laughing: motivation up, community +3. One per weekend.', 0, WK.prank.energy);
    if (!sl.night) {
      const track = s.div || 'Novice';
      if (sl.star) opt('star', `${sl.rare ? 'High-level' : 'Star'} workshop: ${sl.topicName}`, `${P.name}'s ${sl.rare ? 'advanced' : track} class. ${LABEL[sl.topic]}: ${gainRange(s, sl.rare ? 'starRare' : 'star', sl.topic, 5, 7)}.`, 0, WK.star.energy);
      else opt('workshop', `Workshop: ${sl.topicName}`, `${track} track, included in your pass. ${LABEL[sl.topic]}: ${gainRange(s, 'workshop', sl.topic, 3, 5)}.`, 0, WK.workshop.energy);
      opt('watch', 'Watch the higher divisions', 'Learn by watching the All-Stars. Small musicality or composure gain, no energy cost.', 0, WK.watch.energy);
      opt('cheer', 'Cheer on your community', 'Scream for your people in their heats. Community +5.', 0, WK.cheer.energy);
      if (!wk.privUsed) {
        if (sl.offer) opt('offer', `Private with ${P.name} (last-minute)`, `${LABEL[P.topic]}: ${gainRange(s, 'pro', P.topic, 9, 12)}. A visiting pro teaches far above your level, and tells you where it stands.`, WK.offerCost, WK.privateEnergy);
        else opt('private', `Private with ${P.name}`, `${LABEL[P.topic]}: ${gainRange(s, 'pro', P.topic, 9, 12)}. A visiting pro teaches far above your level, goes deeper than a home lesson, and tells you where it stands. One per weekend.`, WK.privateCost, WK.privateEnergy);
      }
    }
    if (sl.priya) opt('cheerPriya', named(s, `Cheer {priya}'s ${s.priya.div} final`), 'Community +8 and chemistry +1.', 0, WK.cheerPriya.energy);
    const naps = napsBefore(wk, i), restGain = Math.round((wk.single ? 20 : -WK.rest.energy) * NAP[Math.min(NAP.length - 1, naps)]);
    opt('rest', 'Rest at the hotel', naps ? `You've already rested ${naps === 1 ? 'once' : naps + ' times'} this weekend. Another nap only gives +${restGain} energy.` : `Nap, stretch, eat something real. +${restGain} energy.`, 0, -restGain);
    return o;
  }

  function chooseSlot(s, optId) {
    const wk = s.wk, sl = wk.slots[wk.cur];
    const o = slotOptions(s, wk.cur).find(x => x.id === optId);
    if (!o || !o.ok) return null;
    s.money -= o.money; s.energy = clamp(s.energy - o.energy, 0, 100);
    const d = {}; let note = '', sc = 0;
    const add = (st, base, raw) => gain(s, st, base, raw, d);
    if (optId === 'workshop') { add(sl.topic, rand(3, 5), 'workshop'); note = 'Good drills, lots of rotation.'; }
    else if (optId === 'star') { add(sl.topic, rand(5, 7), sl.rare ? 'starRare' : 'star'); note = `${wk.pro.name} changed how you think about it.`; }
    else if (optId === 'private' || optId === 'offer') { wk.privUsed = true; add(wk.pro.topic, rand(9, 12), 'pro'); add('comp', 1, 'pro'); note = `An hour with ${wk.pro.name}. Worth every dollar. ${readStat(s, wk.pro.topic, wk.pro.name)}`; }
    else if (optId === 'social') {
      // Event socials beat home socials: the die-hards who stay late are strong dancers from everywhere.
      add('conn', rand(2, 3.5), 'eventSocial'); add('mus', rand(2, 4), 'eventSocial'); add('time', rand(1, 2), 'eventSocial'); sc = 6;
      moodShift(s, MOOD.evSocial, 'the late-night social', wk.moods = wk.moods || []);
      const res = wk.res, fin = new Set((res.partners || []).map(p => p.id));
      const rest = (res.others || []).filter(p => !fin.has(p.id));
      // The die-hards are strong dancers, so three are finalists; one isn't, so it's not a giveaway.
      const people = shuffle([...shuffle((res.partners || []).slice()).slice(0, 3), ...shuffle(rest).slice(0, 1)]);
      people.forEach(p => meet(s, p, `${res.ev.name}, ${sl.t.split(' ')[0] === 'Fri' ? 'Friday' : sl.t.startsWith('Sat') ? 'Saturday' : 'Sunday'} social`));
      const names = people.map(p => p.name);
      note = `You danced with ${names.slice(0, -1).join(', ')} and ${names[names.length - 1]} till ${sl.t === 'Fri night' ? 'midnight' : '2 a.m.'}.`;
      if (rnd() < proChance(s) + .1 && !s.discount) { s.discount = true; note += ' A pro danced with you too and liked it: $40 off your next private at home.'; }
    }
    else if (optId === 'cheer') { sc = 5; note = 'Your voice is gone. Your community noticed.'; }
    else if (optId === 'cheerPriya') { sc = 8; s.chem = Math.min(3, s.chem + 1); note = named(s, '{priya} found you in the crowd after. Chemistry up.'); }
    else if (optId === 'watch') { add(rnd() < .5 ? 'mus' : 'comp', 1, true); note = 'The All-Star final was unreal.'; }
    else if (optId === 'prank') { wk.pranked = true; sc = 3; note = pick(PRANKS); moodShift(s, MOOD.prank, 'the prank', wk.moods = wk.moods || []); }
    else if (optId === 'rest') { note = napsBefore(wk, wk.cur) ? 'More lying around. It helps a little.' : 'A real nap. Your legs thank you.'; }
    if (sl.snore) { s.energy = Math.max(0, s.energy - 10); note += ' Then the snoring started. −10 energy.'; o.energy += 10; }
    s.sc = clamp(s.sc + sc, 0, 100);
    sl.done = true; sl.choice = optId; sl.result = { title: o.title, d, sc, energy: -o.energy, money: o.money, note };
    wk.cur++;
    return sl.result;
  }

  function markOut(s) {
    const wk = s.wk; wk.res.out = true;
    wk.slots.forEach((sl, i) => { if (i >= wk.cur && sl.round) { sl.wasRound = sl.round; sl.round = null; sl.night = /night/i.test(sl.t); } });
  }

  // Prelims and semis are three songs, and partners rotate each song. Everyone you dance with is "met".
  // Judged alone, but a partner you already know makes you look a bit better: +0.5 per known partner, max 1.5.
  function heatBonus(s, res, round) {
    const known = (res.heat[round] || []).filter(p => metWhere(s, p).length > 1); // met before this heat
    res.heatKnown = { ...(res.heatKnown || {}), [round]: known.map(p => p.name) };
    return Math.min(1.5, .5 * known.length);
  }
  function heatPartners(s, res, round, pool) {
    res.heat = res.heat || {};
    res.heat[round] = shuffle(pool.slice()).slice(0, 3).map(p => ({ id: p.id, name: p.name, bib: p.bib }));
    res.heat[round].forEach(p => meet(s, p, `${res.ev.name} ${round === 'Prelims' ? 'prelims' : 'semifinal'}`));
  }
  function danceRound(s) {
    const wk = s.wk, sl = wk.slots[wk.cur], res = wk.res, ev = res.ev;
    const ef = energyFactor(s.energy);
    const floor = { ...s.stats }; if (s.gear.outfit) floor.comp = Math.min(STAT_MAX, floor.comp + 6);
    const me = { name: s.name, bib: s.bib, stats: floor, isPlayer: true };
    res.energyAt = res.energyAt || {}; res.energyAt[sl.round] = s.energy;
    let info;
    if (sl.round === 'Prelims') {
      const prelimW = PRELIM_W;
      heatPartners(s, res, 'Prelims', res.others || []);
      const kb = heatBonus(s, res, 'Prelims');
      const nerves = !s.heatDone; s.heatDone = true;
      const nervePen = nerves ? 4 * (1 - s.stats.comp / 100) : 0;
      res.nerves = Math.round(nervePen * 10) / 10;
      const pScore = c => c.isPlayer
        ? weighted(c.stats, prelimW) * ef - nervePen + kb + gauss() * 4 * LUCK * PRE_SHARED * Math.max(.2, 1 - c.stats.comp / 150) * (nerves ? 1.5 : 1)
        : weighted(c.stats, prelimW) + gauss() * 4 * LUCK * PRE_SHARED;
      const r1 = cutRound('Prelims', res.hasSemi ? 'Semifinal' : 'Final', [me, ...res.rivals], res.hasSemi ? 16 : 8, pScore);
      res.rounds.push(r1.info); res.pool = r1.advancers; info = r1.info;
    } else if (sl.round === 'Semifinal') {
      const pool = res.pool.map(c => c.isPlayer ? me : c);
      const semiIds = new Set(res.otherSemi || []);
      heatPartners(s, res, 'Semifinal', (res.others || []).filter(p => semiIds.has(p.id)));
      const kb = heatBonus(s, res, 'Semifinal');
      const songs = songSet();
      const sw = so => { const x = {}; STATS.forEach(k => x[k] = songW(so)[k] * .75 + (k === 'time' ? .25 : 0)); return x; };
      const w = {}; STATS.forEach(k => w[k] = songs.reduce((a, so) => a + sw(so)[k], 0) / songs.length);
      const fm = {}; STATS.forEach(k => fm[k] = pool.reduce((a, c) => a + c.stats[k], 0) / pool.length);
      const moments = [];
      for (let i = 0; i < 3; i++) {
        const st = weightedPick(sw(songs[i])); const mine = floor[st] * (st === 'comp' ? 1 : ef);
        const ok = rnd() < sigmoid((mine - fm[st]) / 5);
        moments.push({ stat: st, ok, text: pick(PHRASES[st][ok ? 'good' : 'bad']), song: i });
      }
      const msum = moments.reduce((a, m) => a + (m.ok ? 1 : -1), 0);
      const sScore = c => c.isPlayer ? weighted(c.stats, w) * ef + msum * 1.1 + kb + gauss() * 3 * LUCK * PRE_SHARED * Math.max(.2, 1 - c.stats.comp / 150) : weighted(c.stats, w) + gauss() * 4 * LUCK * PRE_SHARED;
      const mine = {}; STATS.forEach(k => mine[k] = floor[k] * (k === 'comp' ? 1 : ef));
      res.semi = { song: songs[0], songs, weights: w, moments, partners: res.heat.Semifinal, fit: songs.map(so => songFit(sw(so), mine, fm)) };
      moments.filter(m => !m.ok).forEach(m => res.fails.push(m.stat));
      const r2 = cutRound('Semifinal', 'Final', pool, 8, sScore);
      res.rounds.push(r2.info); res.pool = r2.advancers; info = r2.info;
    } else {
      runFinal(s, res, me, ef); info = { final: true };
    }
    s.energy = Math.max(0, s.energy - ROUND_ENERGY[sl.round]);
    if (wk.crash) { s.energy = Math.max(0, s.energy - 20); wk.crash = false; wk.crashed = true; }
    sl.done = true; sl.result = { round: sl.round, info, place: res.place, points: res.points };
    wk.cur++;
    if (info && info.final === undefined && !info.advanced) markOut(s);
    return sl.result;
  }

  // Judging a final: the chance a judge catches any one moment, what it's worth, and the rest of their noise.
  // Each moment is worth `see` × `hit` on average (~1.1–1.2, as before), so mostly the spread changes (Steve, v43).
  const JUDGING = { floor: { see: .3, hit: 7, noise: 7 }, spot: { see: 1, hit: 1.1, noise: 1.2 } }; // v45: mid-pack consensus (5,5,5,6,5) ~3%
  function runFinal(s, res, me, ef) {
    const ev = res.ev;
    const pool = res.pool.map(c => c.isPlayer ? me : c);
    // Novice finals are three songs with the same partner. A spotlight is one song, each couple alone,
    // and it leans hard on Composure.
    const spot = !!res.spotlight;
    const played = res.semi && res.semi.songs; const songs = spot ? [pick(fresh(played).filter(so => so.genre !== 'Blues'))] : songSet(played);
    const gw = so => { const x = {}; STATS.forEach(k => x[k] = spot ? songW(so)[k] * .7 + (k === 'comp' ? .3 : 0) : songW(so)[k]); return x; };
    const w = {}; STATS.forEach(k => w[k] = songs.reduce((a, so) => a + gw(so)[k], 0) / songs.length);
    const song = songs[0];
    const partners = shuffle([...(res.partners || Array.from({ length: 8 }, () => makeNPC(60)))]);
    const legacyMet = new Set(res.met || []); // saves from v18 kept met bibs per event
    const familiar = b => b.priya ? Math.min(FAMILIAR_CAP, FAMILIAR * (1 + (s.chem || 0))) : Math.min(FAMILIAR_CAP, FAMILIAR * metWhere(s, b).length + (legacyMet.has(b.bib) ? 6 : 0));
    const couples = pool.map((a, i) => {
      const b = partners[i]; const st = coupleStats(a, b);
      if (a.isPlayer) st.conn = Math.min(STAT_MAX, st.conn + familiar(b)); // you've danced together before
      return { a, b, isPlayer: !!a.isPlayer, stats: st, base: weighted(st, w) };
    });
    const fm = {}; STATS.forEach(k => fm[k] = couples.reduce((acc, c) => acc + c.stats[k], 0) / couples.length);
    const pc = couples.find(c => c.isPlayer);
    const moments = [];
    for (let i = 0; i < 6; i++) {
      const si = spot ? 0 : Math.floor(i / 2); // two moments per song
      const st = i === 5 ? 'comp' : weightedPick(gw(songs[si])); const mine = pc.stats[st] * (st === 'comp' ? 1 : ef);
      const ok = rnd() < sigmoid((mine - fm[st]) / 5);
      moments.push({ stat: st, ok, text: pick(PHRASES[st][ok ? 'good' : 'bad']), song: si });
    }
    moments.filter(m => !m.ok).forEach(m => res.fails.push(m.stat));
    const mine = {}; STATS.forEach(k => mine[k] = pc.stats[k] * (k === 'comp' ? 1 : ef));
    res.fit = songs.map(so => songFit(gw(so), mine, fm));
    res.vs = { you: round0(mine), field: round0(fm), ef: Math.round(ef * 100) };
    // Every couple has standout moments, good and bad (yours are the feed above; the others' are rolled the same way
    // from how they compare to the floor). On a full floor each judge catches only some of them, so a couple with
    // a mix of great and messy moments can get 1sts and 7ths, while a consistent couple gets consistent marks.
    // In a spotlight every judge sees every moment: the marks are tight.
    const meanBase = couples.reduce((a, c) => a + c.base, 0) / couples.length;
    couples.forEach(c => {
      c.moments = c.isPlayer ? moments.map(m => m.ok) : Array.from({ length: 6 }, () => rnd() < sigmoid((c.base - meanBase) / 12)); // a gentle tilt: better couples have more good moments
      c.perf = c.isPlayer ? c.base * ef + gauss() * 3 * (1 - c.stats.comp / 150) : c.base + gauss() * 3.5;
    });
    const J = spot ? JUDGING.spot : JUDGING.floor;
    const ranksByJudge = JUDGES.map(j => {
      const sc = couples.map((c, i) => ({ i, v: c.perf + .12 * (c.stats[j.focus] - fm[j.focus]) + gauss() * J.noise
        + c.moments.reduce((a, ok) => a + (rnd() < J.see ? (ok ? J.hit : -J.hit) : 0), 0) }));
      sc.sort((x, y) => y.v - x.v); const r = []; sc.forEach((x, k) => r[x.i] = k + 1); return r;
    });
    const ranks = couples.map((_, i) => JUDGES.map((_, j) => ranksByJudge[j][i]));
    const order = relativePlacement(ranks);
    const pIdx = couples.indexOf(pc);
    const place = order.indexOf(pIdx) + 1;
    const gap = STATS.reduce((a, k) => a + Math.max(0, s.stats[k] - pc.b.stats[k]), 0) / STATS.length;
    Object.assign(res, {
      madeFinal: true, song, songs, weights: w, place, points: POINTS[ev.tier][place - 1] || 0, moments,
      partner: { name: pc.b.name, bib: pc.b.bib, strong: pc.b.strong, stats: pc.b.stats, bonus: familiar(pc.b), ...(pc.b.priya ? { priya: true } : {}), metWhere: metWhere(s, pc.b), met: familiar(pc.b) > 0 },
      rescue: { pct: Math.round(rescueFrac(s.stats.comp) * 100), gap: Math.round(gap) },
      notes: JUDGES.map(j => ({ judge: j.name, good: pc.stats[j.focus] - fm[j.focus] >= 0, text: JUDGE_NOTES[j.focus][pc.stats[j.focus] - fm[j.focus] >= 0 ? 0 : 1] })),
      table: order.map((i, k) => {
        const c = couples[i]; const lead = s.role === 'Lead' ? c.a : c.b, follow = s.role === 'Lead' ? c.b : c.a;
        return { place: k + 1, isPlayer: c.isPlayer, ranks: ranks[i], why: order.why[i], lead: { name: lead.name, bib: lead.bib, rival: !!lead.rival, ...(lead.priya ? { priya: true } : {}) }, follow: { name: follow.name, bib: follow.bib, rival: !!follow.rival, ...(follow.priya ? { priya: true } : {}) } };
      }),
    });
    s.points += res.points;
    const pz = (ev.prize || [])[place - 1] || 0;
    res.prizePass = pz === 'pass'; if (res.prizePass) s.passes = (s.passes || 0) + 1; // a free pass to a future event
    res.prize = res.prizePass ? 0 : pz;
    s.money += res.prize; s.winnings = (s.winnings || 0) + res.prize;
  }

  // Priya: your practice partner, a Novice a step ahead of you. She competes at every circuit event in her own
  // division, and with her head start she usually points out around the middle of season 1.
  const PRIYA = { pts: 8, skill: 62, rate: 1.15 };
  function priyaRoll(s, ev) {
    const p = s.priya, size = EVENTS[ev.id].size[p.div]; if (!size || !POP[p.div]) return { final: false, place: null, pts: 0 };
    return { ...rollAt(s.scene.filter(d => d.div === p.div), p.skill, size), div: p.div };
  }
  // Someone you only hear about (Priya, a rival in another division): how far they got against a field of `size`.
  function rollAt(pool, skill, size) {
    const mine = skill + gauss() * 4 * LUCK;
    let ahead = 0; for (let i = 0; i < size - 1 && pool.length; i++) if (pick(pool).skill + gauss() * 4 * LUCK > mine) ahead++;
    if (ahead >= 8) return { final: false, place: null, pts: 0 };
    const place = Math.min(8, Math.max(1, ahead + 1 + Math.round(gauss() * 1.5)));
    return { final: true, place, pts: POINTS[tierOf(size)][place - 1] || 0 };
  }
  // Priya as she enters an event in your division (the other role): her skill with her strengths.
  function priyaDancer(s) {
    const k = s.priya.skill, st = { time: k, tech: k + 6, conn: k + 6, mus: k - 4, comp: k - 2 };
    STATS.forEach(x => st[x] = clamp(Math.round(st[x]), 10, STAT_MAX));
    return { id: 'priya', name: named(s, '{priya}'), bib: bib(), stats: st, strong: 'conn', priya: true };
  }
  // Her result when she danced your division: straight from the rounds (and the final, if it was danced with you in it).
  function priyaHere(s, res) {
    const ev = res.ev, me = res.partners.find(c => c.priya);
    if (!me) return { final: false, place: null, pts: 0, div: ev.div };
    let place;
    const row = (res.table || []).find(t => t.lead.bib === me.bib || t.follow.bib === me.bib);
    if (row) place = row.place;
    else { const v = c => weighted(c.stats, PRELIM_W) + gauss() * 4; place = res.partners.map(c => ({ c, x: v(c) })).sort((a, b) => b.x - a.x).findIndex(o => o.c === me) + 1; }
    return { final: true, place, pts: POINTS[ev.tier][place - 1] || 0, div: ev.div, withYou: !!(row && res.partner && res.partner.bib === me.bib) };
  }
  function applyPriya(s, r, ev) {
    const p = s.priya; if (!r || r.div && r.div !== p.div) return;
    p.pts += r.pts;
    const res = r.final ? `${ordinal(r.place)} in the final${r.withYou ? ', dancing with you' : ''}${r.pts ? `, +${r.pts}` : ''}` : 'missed the final';
    let text = named(s, `{priya} at ${ev.name}: ${res}.`);

function ptsTable(tier) { const P = E.POINTS[tier], n = Math.min(5, P.length); return P.slice(0, n).map((p, i) => E.ordinal(i + 1) + ' ' + p).join(' · ') + (P.length > 5 ? ' · 6th–8th ' + P[5] : ` · ${E.ordinal(n + 1)}–8th no points`); }
function reviewBlock() {
  const r = V.ev; const opts = E.reviewOptions(S, r);
  if (!opts.length) return '';
  if (V.review) {
    const rv = V.review;
    return `<section class="block"><p class="eyebrow">Video review</p>
      <h2>${rv.kind === 'coach' ? 'Your coach watched the footage' : 'You watched your own footage'}</h2>
      <div class="chips">${Object.entries(rv.deltas).map(([k, v]) => gainChip(k, v)).join('')}</div>
      ${rv.read ? `<p>${rv.read.map(esc).join('<br>')}</p>` : ''}
      ${rv.note ? `<p>${esc(rv.note)}</p><p class="muted tiny">Focus on ${E.LABEL[rv.leak].toLowerCase()} for the next 2 weeks: gains in it are 50% bigger.</p>` : ''}</section>`;
  }
  const footage = !!(r.semi || r.madeFinal);
  const fails = r.fails.length;
  const opt = (kind, title, desc) => {
    const cost = E.REVIEW[kind]; const ok = S.money >= cost;
    return `<button class="opt" data-review="${kind}" ${ok ? '' : 'disabled'}><span class="t">${title}</span><span class="c">${cost ? '$' + cost : 'Free'}</span><span class="d">${desc}${ok ? shortNote(cost) : ' <b style="color:var(--bad)">Not enough money.</b>'}</span></button>`;
  };
  return `<section class="block"><p class="eyebrow">Optional · doesn't use a week</p><h2>Video review</h2>
    <p class="muted" style="font-size:.86rem">${footage ? `Your ${r.madeFinal ? 'final' : 'semifinal'} was filmed. ${fails ? `${fails} moment${fails === 1 ? '' : 's'} went wrong. The review works on those first.` : 'Nothing went wrong, so the review works on your weakest area.'}` : `Prelims weren't filmed, but a friend caught your heat on their phone.`}</p>
    <div class="stack">
      ${footage ? opt('self', 'Watch it yourself', `${cap(E.gainWord(E.reviewBudget(S, r, 'self')))}, spread across what went wrong.`) + opt('coach', 'Send it to a coach', `${cap(E.gainWord(E.reviewBudget(S, r, 'coach')))}, plus the one thing to fix first (gains in it are 50% bigger for 2 weeks), and where that skill and your best one stand in ${divNow()}.`)
        : opt('self', 'Watch the phone video', `${cap(E.gainWord(E.reviewBudget(S, r, 'self')))} in your weakest area against this field.`)}
    </div></section>`;
}
